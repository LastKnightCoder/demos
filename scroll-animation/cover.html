<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>animation-range: cover ｜ 示意</title>
<script>
  /* 仅用于主题：URL 带 isDark=1 时启用深色模式 */
  if (new URLSearchParams(location.search).get('isDark') === '1')
    document.documentElement.classList.add('dark');
</script>
<style>
  :root {
    color-scheme: light;
    --bg: #f7f7fa;
    --glow: rgba(99,102,241,.08);
    --panel: #ffffff;
    --panel-border: #e7e7ee;
    --view-bg: #fbfbfe;
    --dots: #e9e9f1;
    --fill: #ececf3;
    --accent: #6366f1;
    --accent2: #a855f7;
    --accent-weak: rgba(99,102,241,.35);
    --green: #10b981;
    --orange: #f97316;
    --muted: #8b8b9a;
    --chip-bg: rgba(255,255,255,.95);
    --bar-track: #ececf3;
    --shadow: 0 22px 50px rgba(30,30,50,.10);
    --target-shadow: 0 10px 26px rgba(30,30,50,.12);

    /* 完整旅程：元素从视口下方 0.5 视口高处（完全不可见）出发，穿越视口，
       到视口上方 0.5 视口高处（完全消失）。总行程 = 2.5 × 视口高。
       旅程关键点：20% 顶边触底线 / 40% 底边触底线 / 60% 顶边触顶线 / 80% 底边触顶线 */
    --vh: clamp(170px, min(56vw, 44vh), 320px);
    --th: calc(var(--vh) * 0.5);
    --gap: calc(var(--vh) * 0.5);
    --dur: 14s;
  }
  :root.dark {
    color-scheme: dark;
    --bg: #0e0e14;
    --glow: rgba(129,140,248,.10);
    --panel: #17171f;
    --panel-border: #2b2b38;
    --view-bg: #12121a;
    --dots: #21212c;
    --fill: #272734;
    --accent: #818cf8;
    --accent2: #c084fc;
    --accent-weak: rgba(129,140,248,.40);
    --green: #34d399;
    --orange: #fb923c;
    --muted: #7d7d8f;
    --chip-bg: rgba(23,23,31,.92);
    --bar-track: #272734;
    --shadow: 0 22px 50px rgba(0,0,0,.45);
    --target-shadow: 0 10px 26px rgba(0,0,0,.40);
  }

  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    overflow: hidden;
    display: grid; place-items: center;
    background: var(--bg);
    background-image: radial-gradient(52% 42% at 50% 42%, var(--glow), transparent 75%);
    font-family: ui-sans-serif, -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }

  .fig { width: min(480px, 94vw, calc(var(--vh) * 2.2)); }
  figcaption { text-align: center; margin-bottom: 12px; }
  figcaption span {
    display: inline-block;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: clamp(10.5px, 3.2vw, 12.5px); color: var(--muted);
    white-space: nowrap;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    padding: 5px 14px; border-radius: 999px;
  }
  figcaption b { color: var(--accent); font-weight: 700; }

  .vp {
    background: var(--panel);
    border: 1.5px solid var(--panel-border);
    border-radius: 18px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .chrome {
    height: 30px;
    display: flex; align-items: center; gap: 6px;
    padding: 0 12px;
    border-bottom: 1px solid var(--panel-border);
  }
  .chrome i { width: 8px; height: 8px; border-radius: 50%; background: var(--fill); flex: none; }
  .chrome .addr { flex: 1; height: 13px; margin-left: 8px; border-radius: 999px; background: var(--bar-track); }
  .view {
    position: relative;
    height: var(--vh);
    overflow: hidden;
    background: var(--view-bg);
    background-image: radial-gradient(var(--dots) 1px, transparent 1px);
    background-size: 22px 22px;
  }

  .track { position: absolute; top: 0; left: 0; right: 0; animation: move var(--dur) linear infinite alternate; }
  @keyframes move {
    from { transform: translateY(0); }
    to   { transform: translateY(calc((var(--vh) + var(--th) + var(--gap) * 2) * -1)); }
  }
  .filler {
    padding: 14px clamp(12px, 7%, 36px);
    background-image:
      repeating-linear-gradient(to bottom, var(--fill) 0 9px, transparent 9px 40px),
      repeating-linear-gradient(to bottom, var(--fill) 0 9px, transparent 9px 40px);
    background-origin: content-box;
    background-clip: content-box;
    background-size: 100% 100%, 58% 100%;
    background-position: 0 0, 0 20px;
    background-repeat: repeat, repeat;
  }
  .filler.a { height: calc(var(--vh) + var(--gap)); }
  .filler.b { height: calc(var(--vh) + var(--gap) + 40px); }

  /* cover：覆盖整个可见过程 —— 顶边触底线(20%) → 底边触顶线(80%) */
  @property --progress { syntax: "<integer>"; initial-value: 0; inherits: true; }
  .fig { animation: prog var(--dur) linear infinite alternate; }
  @keyframes prog {
    0%, 20%  { --progress: 0; }
    80%, 100%{ --progress: 100; }
  }
  .target {
    position: relative;
    height: var(--th);
    margin: 0 clamp(10px, 8%, calc(var(--vh) * 0.17));
    background: var(--panel);
    border: 1.5px solid var(--panel-border);
    border-radius: calc(var(--vh) * 0.05);
    box-shadow: var(--target-shadow);
    overflow: hidden;
  }
  .target::before {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(90deg, rgba(99,102,241,.10), rgba(168,85,247,.18));
    transform-origin: left center;
    transform: scaleX(calc(var(--progress) / 100));
  }
  .target .num {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    font-size: calc(var(--vh) * 0.15);
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
  .target .num::after {
    counter-reset: p var(--progress); content: counter(p) "%";
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
  }
  .edge { position: absolute; left: 0; right: 0; height: 4px; z-index: 2; }
  .edge.top { top: 0; background: var(--green); }
  .edge.bot { bottom: 0; background: var(--orange); }
  .edge b {
    position: absolute; left: 10px;
    font-size: 10px; font-weight: 600; white-space: nowrap;
    color: #fff; padding: 2px 8px; border-radius: 999px;
  }
  .edge.top b { top: 7px; background: var(--green); }
  .edge.bot b { bottom: 7px; background: var(--orange); }

  /* 视口顶边 / 底边 双基准虚线 */
  .vp-edge { position: absolute; left: 0; right: 0; z-index: 6; pointer-events: none; }
  .vp-edge.bottom { bottom: 0; }
  .vp-edge.top    { top: 0; }
  .vp-edge i { display: block; border-top: 2.5px dashed var(--accent); }
  .vp-edge span {
    position: absolute; right: 10px;
    font-size: 11px; font-weight: 600; color: var(--accent);
    background: var(--chip-bg);
    border: 1px solid var(--accent-weak);
    padding: 3px 10px; border-radius: 999px;
  }
  .vp-edge.bottom span { bottom: 8px; }
  .vp-edge.top span    { top: 8px; }
  .vp-edge .short { display: none; font-style: normal; }
  .vp-edge .full  { font-style: normal; }

  .chip {
    position: absolute; left: 10px; z-index: 5;
    display: flex; align-items: center; gap: 6px;
    font-size: 11px; font-weight: 600;
    padding: 4px 10px; border-radius: 999px;
    background: var(--chip-bg);
    border: 1px solid var(--panel-border);
    box-shadow: 0 4px 14px rgba(0,0,0,.10);
    opacity: 0; pointer-events: none;
  }
  .chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; }
  .chip.c0   { bottom: 10px; color: var(--green);  animation: flash0   var(--dur) linear infinite alternate; }
  .chip.c100 { top: 10px;    color: var(--orange); animation: flash100 var(--dur) linear infinite alternate; }
  .chip.c0::before   { background: var(--green); }
  .chip.c100::before { background: var(--orange); }
  @keyframes flash0 {           /* 旅程 20%：顶边触底线 → 0%，窗口以触线点为中心对称，正反向一致 */
    0%, 16%  { opacity: 0; }
    20%      { opacity: 1; }
    24%, 100%{ opacity: 0; }
  }
  @keyframes flash100 {         /* 旅程 80%：底边触顶线 → 100%，窗口以触线点为中心对称，正反向一致 */
    0%, 76%  { opacity: 0; }
    80%      { opacity: 1; }
    84%, 100%{ opacity: 0; }
  }

  .prog { margin-top: 14px; }
  .prog .head {
    display: flex; justify-content: space-between; align-items: baseline;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 12px; color: var(--muted); margin-bottom: 6px;
  }
  .prog .val { font-size: 14px; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }
  .prog .val::after { counter-reset: p var(--progress); content: counter(p) "%"; }
  .prog .bar { height: 6px; border-radius: 3px; background: var(--bar-track); overflow: hidden; }
  .prog .bar i {
    display: block; height: 100%; border-radius: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    transform-origin: left center;
    animation: bar var(--dur) linear infinite alternate;
  }
  @keyframes bar {
    0%, 20%  { transform: scaleX(0); }
    80%, 100%{ transform: scaleX(1); }
  }
  .marks { display: flex; justify-content: space-between; margin-top: 8px; font-size: 11.5px; color: var(--muted); }
  .marks span::before {
    content: ""; display: inline-block;
    width: 12px; height: 4px; border-radius: 2px;
    margin-right: 6px; vertical-align: 2px;
  }
  .marks .m0::before   { background: var(--green); }
  .marks .m100::before { background: var(--orange); }

  @media (max-width: 380px) {
    .vp-edge .full  { display: none; }
    .vp-edge .short { display: inline; }
    .marks { font-size: 10.5px; flex-wrap: wrap; gap: 2px 10px; }
    .chip  { font-size: 10px; padding: 3px 8px; }
    .edge b { font-size: 9px; padding: 1px 6px; }
  }
  @media (max-height: 480px) {
    figcaption { margin-bottom: 8px; }
    .prog { margin-top: 10px; }
    .chip { font-size: 10px; padding: 3px 8px; }
    .edge b { font-size: 9px; padding: 1px 6px; }
  }
  @media (max-height: 360px) {
    figcaption { display: none; }
    .chrome { height: 26px; }
    .prog { margin-top: 10px; }
  }
</style>
</head>
<body>

<figure class="fig">
  <figcaption><span>animation-range: <b>cover 0% cover 100%</b></span></figcaption>
  <div class="vp">
    <div class="chrome"><i></i><i></i><i></i><div class="addr"></div></div>
    <div class="view">
      <div class="track">
        <div class="filler a"></div>
        <div class="target">
          <span class="edge top"><b>元素顶边</b></span>
          <span class="edge bot"><b>元素底边</b></span>
          <span class="num"></span>
        </div>
        <div class="filler b"></div>
      </div>
      <div class="chip c0">cover 0% · 顶边触底线</div>
      <div class="chip c100">cover 100% · 底边触顶线</div>
      <div class="vp-edge top"><i></i><span><em class="full">视口顶边（start edge）</em><em class="short">视口顶边</em></span></div>
      <div class="vp-edge bottom"><i></i><span><em class="full">视口底边（end edge）</em><em class="short">视口底边</em></span></div>
    </div>
  </div>
  <div class="prog">
    <div class="head"><span>cover 进度</span><span class="val"></span></div>
    <div class="bar"><i></i></div>
    <div class="marks"><span class="m0">0% · 元素顶边触底线</span><span class="m100">100% · 元素底边触顶线</span></div>
  </div>
</figure>

</body>
</html>
