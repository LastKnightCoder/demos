<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>焦点事件触发顺序示例</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function EventOrderDemo() {
            const [logs, setLogs] = useState([]);
            const [isDark, setIsDark] = useState(false);
            const inputARef = useRef(null);
            const inputBRef = useRef(null);

            useEffect(() => {
                if (isDark) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }, [isDark]);

            const addLog = (eventType, target) => {
                const timestamp = new Date().toLocaleTimeString('zh-CN', {
                    hour12: false,
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit',
                    fractionalSecondDigits: 3
                });
                setLogs(prev => [...prev, {
                    id: Date.now() + Math.random(),
                    time: timestamp,
                    event: eventType,
                    target: target,
                    color: getEventColor(eventType)
                }]);
            };

            const getEventColor = (eventType) => {
                const colors = {
                    'focusout': 'text-red-600 dark:text-red-400',
                    'focusin': 'text-green-600 dark:text-green-400',
                    'blur': 'text-orange-600 dark:text-orange-400',
                    'focus': 'text-blue-600 dark:text-blue-400'
                };
                return colors[eventType] || 'text-gray-600';
            };

            const clearLogs = () => {
                setLogs([]);
            };

            const setupEventListeners = (element, name) => {
                if (!element) return;

                element.addEventListener('focus', () => addLog('focus', name));
                element.addEventListener('blur', () => addLog('blur', name));
                element.addEventListener('focusin', () => addLog('focusin', name));
                element.addEventListener('focusout', () => addLog('focusout', name));
            };

            useEffect(() => {
                const inputA = inputARef.current;
                const inputB = inputBRef.current;

                setupEventListeners(inputA, '元素 A');
                setupEventListeners(inputB, '元素 B');
            }, []);

            return (
                <div className="max-w-6xl mx-auto p-8">
                    {/* Header */}
                    <div className="flex justify-between items-center mb-8">
                        <div>
                            <h1 className="text-3xl font-bold text-gray-900 dark:text-white mb-2">
                                焦点事件触发顺序演示
                            </h1>
                            <p className="text-gray-600 dark:text-gray-400">
                                在元素 A 和元素 B 之间切换焦点，观察事件触发顺序
                            </p>
                        </div>
                        <button
                            onClick={() => setIsDark(!isDark)}
                            className="px-4 py-2 rounded-lg bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-gray-200 hover:bg-gray-300 dark:hover:bg-gray-600 transition-colors"
                        >
                            {isDark ? '🌞 浅色' : '🌙 深色'}
                        </button>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                        {/* Left Panel - Interactive Elements */}
                        <div className="space-y-6">
                            <div className="bg-white dark:bg-gray-800 rounded-lg shadow-lg p-6">
                                <h2 className="text-xl font-semibold text-gray-900 dark:text-white mb-4">
                                    交互元素
                                </h2>
                                <div className="space-y-4">
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                                            元素 A
                                        </label>
                                        <input
                                            ref={inputARef}
                                            type="text"
                                            placeholder="点击聚焦到元素 A"
                                            className="w-full px-4 py-3 border-2 border-blue-300 dark:border-blue-600 rounded-lg focus:outline-none focus:border-blue-500 dark:focus:border-blue-400 bg-white dark:bg-gray-700 text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                                            元素 B
                                        </label>
                                        <input
                                            ref={inputBRef}
                                            type="text"
                                            placeholder="点击聚焦到元素 B"
                                            className="w-full px-4 py-3 border-2 border-green-300 dark:border-green-600 rounded-lg focus:outline-none focus:border-green-500 dark:focus:border-green-400 bg-white dark:bg-gray-700 text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500"
                                        />
                                    </div>
                                </div>

                                <div className="mt-6 p-4 bg-blue-50 dark:bg-blue-900/20 rounded-lg">
                                    <h3 className="font-semibold text-blue-900 dark:text-blue-300 mb-2">
                                        预期顺序
                                    </h3>
                                    <p className="text-sm text-blue-800 dark:text-blue-400 font-mono">
                                        focusout(A) → focusin(B) → blur(A) → focus(B)
                                    </p>
                                </div>
                            </div>
                        </div>

                        {/* Right Panel - Event Logs */}
                        <div className="bg-white dark:bg-gray-800 rounded-lg shadow-lg p-6">
                            <div className="flex justify-between items-center mb-4">
                                <h2 className="text-xl font-semibold text-gray-900 dark:text-white">
                                    事件日志
                                </h2>
                                <button
                                    onClick={clearLogs}
                                    className="px-3 py-1 text-sm bg-red-500 hover:bg-red-600 text-white rounded-lg transition-colors"
                                >
                                    清空日志
                                </button>
                            </div>
                            <div className="h-96 overflow-y-auto bg-gray-50 dark:bg-gray-900 rounded-lg p-4 font-mono text-sm">
                                {logs.length === 0 ? (
                                    <div className="text-center text-gray-400 dark:text-gray-600 mt-8">
                                        暂无事件日志，请开始操作...
                                    </div>
                                ) : (
                                    <div className="space-y-2">
                                        {logs.map((log) => (
                                            <div
                                                key={log.id}
                                                className="flex items-center space-x-3 p-2 bg-white dark:bg-gray-800 rounded border-l-4 border-gray-300 dark:border-gray-600 animate-fade-in"
                                            >
                                                <span className="text-gray-500 dark:text-gray-500 text-xs">
                                                    {log.time}
                                                </span>
                                                <span className={`font-semibold ${log.color}`}>
                                                    {log.event}
                                                </span>
                                                <span className="text-gray-600 dark:text-gray-400">
                                                    ({log.target})
                                                </span>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>

                    {/* Info Box */}
                    <div className="mt-8 bg-gradient-to-r from-purple-50 to-pink-50 dark:from-purple-900/20 dark:to-pink-900/20 rounded-lg p-6">
                        <h3 className="text-lg font-semibold text-gray-900 dark:text-white mb-3">
                            📝 说明
                        </h3>
                        <ul className="space-y-2 text-gray-700 dark:text-gray-300">
                            <li>• 当焦点从元素 A 移动到元素 B 时，事件触发顺序是固定的</li>
                            <li>• <code className="px-2 py-1 bg-white dark:bg-gray-800 rounded">focusout</code> 和 <code className="px-2 py-1 bg-white dark:bg-gray-800 rounded">focusin</code> 事件会在 <code className="px-2 py-1 bg-white dark:bg-gray-800 rounded">blur</code> 和 <code className="px-2 py-1 bg-white dark:bg-gray-800 rounded">focus</code> 之前触发</li>
                            <li>• 这个顺序在所有现代浏览器中都是一致的</li>
                        </ul>
                    </div>

                    <style>{`
                        @keyframes fade-in {
                            from {
                                opacity: 0;
                                transform: translateX(-10px);
                            }
                            to {
                                opacity: 1;
                                transform: translateX(0);
                            }
                        }
                        .animate-fade-in {
                            animation: fade-in 0.3s ease-out;
                        }
                    `}</style>
                </div>
            );
        }

        ReactDOM.render(<EventOrderDemo />, document.getElementById('root'));
    </script>
</body>
</html>
