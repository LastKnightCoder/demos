<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实际应用场景：表单焦点管理</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function PracticalDemo() {
            const [logs, setLogs] = useState([]);
            const [isDark, setIsDark] = useState(false);
            const [focusedField, setFocusedField] = useState(null);
            const [formData, setFormData] = useState({
                username: '',
                email: '',
                password: '',
                confirmPassword: '',
                phone: ''
            });
            const [errors, setErrors] = useState({});

            const formWithFocusinRef = useRef(null);
            const formWithFocusRef = useRef(null);

            useEffect(() => {
                if (isDark) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }, [isDark]);

            const addLog = (message, type = 'info') => {
                const timestamp = new Date().toLocaleTimeString('zh-CN', {
                    hour12: false,
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit',
                    fractionalSecondDigits: 3
                });
                setLogs(prev => [...prev, {
                    id: Date.now() + Math.random(),
                    time: timestamp,
                    message: message,
                    type: type
                }]);
            };

            const getLogColor = (type) => {
                const colors = {
                    'info': 'text-blue-600 dark:text-blue-400',
                    'success': 'text-green-600 dark:text-green-400',
                    'warning': 'text-yellow-600 dark:text-yellow-400',
                    'error': 'text-red-600 dark:text-red-400'
                };
                return colors[type] || 'text-gray-600';
            };

            const clearLogs = () => {
                setLogs([]);
            };

            const validateField = (name, value) => {
                switch (name) {
                    case 'username':
                        if (value.length < 3) return '用户名至少需要3个字符';
                        break;
                    case 'email':
                        if (!/\S+@\S+\.\S+/.test(value)) return '请输入有效的邮箱地址';
                        break;
                    case 'password':
                        if (value.length < 6) return '密码至少需要6个字符';
                        break;
                    case 'confirmPassword':
                        if (value !== formData.password) return '两次密码不一致';
                        break;
                    case 'phone':
                        if (!/^1[3-9]\d{9}$/.test(value)) return '请输入有效的手机号';
                        break;
                }
                return null;
            };

            const handleInputChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({ ...prev, [name]: value }));
            };

            const handleBlur = (e) => {
                const { name, value } = e.target;
                const error = validateField(name, value);
                setErrors(prev => ({ ...prev, [name]: error }));
            };

            // 使用 focusin/focusout 实现的智能表单管理
            useEffect(() => {
                const formWithFocusin = formWithFocusinRef.current;

                const handleFocusin = (e) => {
                    if (e.target.tagName === 'INPUT') {
                        const fieldName = e.target.name;
                        setFocusedField(fieldName);
                        addLog(`✅ 表单检测到焦点进入：${getFieldLabel(fieldName)}`, 'success');
                    }
                };

                const handleFocusout = (e) => {
                    if (e.target.tagName === 'INPUT') {
                        const fieldName = e.target.name;
                        const value = e.target.value;
                        const error = validateField(fieldName, value);

                        if (error) {
                            addLog(`❌ 验证失败（${getFieldLabel(fieldName)}）：${error}`, 'error');
                        } else if (value) {
                            addLog(`✓ 验证通过：${getFieldLabel(fieldName)}`, 'success');
                        }

                        setTimeout(() => setFocusedField(null), 100);
                    }
                };

                formWithFocusin.addEventListener('focusin', handleFocusin);
                formWithFocusin.addEventListener('focusout', handleFocusout);

                return () => {
                    formWithFocusin.removeEventListener('focusin', handleFocusin);
                    formWithFocusin.removeEventListener('focusout', handleFocusout);
                };
            }, [formData]);

            // 使用 focus/blur 的对比实现（需要为每个输入框绑定）
            useEffect(() => {
                const formWithFocus = formWithFocusRef.current;
                const inputs = formWithFocus.querySelectorAll('input');

                const handleFocus = (e) => {
                    addLog(`⚠️ focus 事件（需要单独绑定每个输入框）`, 'warning');
                };

                const handleBlur = (e) => {
                    addLog(`⚠️ blur 事件（需要单独绑定每个输入框）`, 'warning');
                };

                // 必须为每个输入框单独绑定事件
                inputs.forEach(input => {
                    input.addEventListener('focus', handleFocus);
                    input.addEventListener('blur', handleBlur);
                });

                return () => {
                    inputs.forEach(input => {
                        input.removeEventListener('focus', handleFocus);
                        input.removeEventListener('blur', handleBlur);
                    });
                };
            }, []);

            const getFieldLabel = (name) => {
                const labels = {
                    username: '用户名',
                    email: '邮箱',
                    password: '密码',
                    confirmPassword: '确认密码',
                    phone: '手机号'
                };
                return labels[name] || name;
            };

            return (
                <div className="max-w-7xl mx-auto p-8">
                    {/* Header */}
                    <div className="flex justify-between items-center mb-8">
                        <div>
                            <h1 className="text-3xl font-bold text-gray-900 dark:text-white mb-2">
                                实际应用：表单焦点管理系统
                            </h1>
                            <p className="text-gray-600 dark:text-gray-400">
                                对比使用 focusin/focusout 和 focus/blur 实现表单验证的区别
                            </p>
                        </div>
                        <button
                            onClick={() => setIsDark(!isDark)}
                            className="px-4 py-2 rounded-lg bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-gray-200 hover:bg-gray-300 dark:hover:bg-gray-600 transition-colors"
                        >
                            {isDark ? '🌞 浅色' : '🌙 深色'}
                        </button>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        {/* Left - focusin/focusout 实现 */}
                        <div className="bg-white dark:bg-gray-800 rounded-lg shadow-lg p-6">
                            <h2 className="text-xl font-semibold text-gray-900 dark:text-white mb-4">
                                使用 focusin/focusout
                                <span className="ml-2 text-sm font-normal text-green-600 dark:text-green-400">
                                    推荐 ✨
                                </span>
                            </h2>
                            <form
                                ref={formWithFocusinRef}
                                className="space-y-4"
                                onSubmit={(e) => e.preventDefault()}
                            >
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
                                        用户名
                                    </label>
                                    <input
                                        type="text"
                                        name="username"
                                        value={formData.username}
                                        onChange={handleInputChange}
                                        onBlur={handleBlur}
                                        className={`w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 bg-white dark:bg-gray-700 text-gray-900 dark:text-white ${
                                            errors.username
                                                ? 'border-red-300 focus:ring-red-500'
                                                : 'border-gray-300 dark:border-gray-600 focus:ring-green-500'
                                        }`}
                                        placeholder="至少3个字符"
                                    />
                                    {errors.username && (
                                        <p className="mt-1 text-xs text-red-600 dark:text-red-400">{errors.username}</p>
                                    )}
                                </div>

                                <div>
                                    <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
                                        邮箱
                                    </label>
                                    <input
                                        type="email"
                                        name="email"
                                        value={formData.email}
                                        onChange={handleInputChange}
                                        onBlur={handleBlur}
                                        className={`w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 bg-white dark:bg-gray-700 text-gray-900 dark:text-white ${
                                            errors.email
                                                ? 'border-red-300 focus:ring-red-500'
                                                : 'border-gray-300 dark:border-gray-600 focus:ring-green-500'
                                        }`}
                                        placeholder="example@email.com"
                                    />
                                    {errors.email && (
                                        <p className="mt-1 text-xs text-red-600 dark:text-red-400">{errors.email}</p>
                                    )}
                                </div>

                                <div>
                                    <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
                                        密码
                                    </label>
                                    <input
                                        type="password"
                                        name="password"
                                        value={formData.password}
                                        onChange={handleInputChange}
                                        onBlur={handleBlur}
                                        className={`w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 bg-white dark:bg-gray-700 text-gray-900 dark:text-white ${
                                            errors.password
                                                ? 'border-red-300 focus:ring-red-500'
                                                : 'border-gray-300 dark:border-gray-600 focus:ring-green-500'
                                        }`}
                                        placeholder="至少6个字符"
                                    />
                                    {errors.password && (
                                        <p className="mt-1 text-xs text-red-600 dark:text-red-400">{errors.password}</p>
                                    )}
                                </div>

                                <div>
                                    <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
                                        确认密码
                                    </label>
                                    <input
                                        type="password"
                                        name="confirmPassword"
                                        value={formData.confirmPassword}
                                        onChange={handleInputChange}
                                        onBlur={handleBlur}
                                        className={`w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 bg-white dark:bg-gray-700 text-gray-900 dark:text-white ${
                                            errors.confirmPassword
                                                ? 'border-red-300 focus:ring-red-500'
                                                : 'border-gray-300 dark:border-gray-600 focus:ring-green-500'
                                        }`}
                                        placeholder="再次输入密码"
                                    />
                                    {errors.confirmPassword && (
                                        <p className="mt-1 text-xs text-red-600 dark:text-red-400">{errors.confirmPassword}</p>
                                    )}
                                </div>

                                <div>
                                    <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
                                        手机号
                                    </label>
                                    <input
                                        type="tel"
                                        name="phone"
                                        value={formData.phone}
                                        onChange={handleInputChange}
                                        onBlur={handleBlur}
                                        className={`w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 bg-white dark:bg-gray-700 text-gray-900 dark:text-white ${
                                            errors.phone
                                                ? 'border-red-300 focus:ring-red-500'
                                                : 'border-gray-300 dark:border-gray-600 focus:ring-green-500'
                                        }`}
                                        placeholder="13800138000"
                                    />
                                    {errors.phone && (
                                        <p className="mt-1 text-xs text-red-600 dark:text-red-400">{errors.phone}</p>
                                    )}
                                </div>
                            </form>

                            <div className="mt-4 p-3 bg-green-50 dark:bg-green-900/20 rounded-lg text-sm">
                                <div className="text-green-900 dark:text-green-300 font-semibold mb-2">
                                    ✅ 优势
                                </div>
                                <ul className="text-green-800 dark:text-green-400 space-y-1">
                                    <li>• 只需在表单容器上绑定一次事件</li>
                                    <li>• 自动监听所有子元素的焦点变化</li>
                                    <li>• 动态添加的表单元素也能被监听</li>
                                    <li>• 代码更简洁，维护更容易</li>
                                </ul>
                            </div>
                        </div>

                        {/* Middle - focus/blur 实现 */}
                        <div className="bg-white dark:bg-gray-800 rounded-lg shadow-lg p-6 opacity-75">
                            <h2 className="text-xl font-semibold text-gray-900 dark:text-white mb-4">
                                使用 focus/blur
                                <span className="ml-2 text-sm font-normal text-orange-600 dark:text-orange-400">
                                    不推荐 ⚠️
                                </span>
                            </h2>
                            <form
                                ref={formWithFocusRef}
                                className="space-y-4"
                                onSubmit={(e) => e.preventDefault()}
                            >
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
                                        用户名
                                    </label>
                                    <input
                                        type="text"
                                        className="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500 bg-white dark:bg-gray-700 text-gray-900 dark:text-white"
                                        placeholder="至少3个字符"
                                    />
                                </div>

                                <div>
                                    <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
                                        邮箱
                                    </label>
                                    <input
                                        type="email"
                                        className="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500 bg-white dark:bg-gray-700 text-gray-900 dark:text-white"
                                        placeholder="example@email.com"
                                    />
                                </div>

                                <div>
                                    <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
                                        密码
                                    </label>
                                    <input
                                        type="password"
                                        className="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500 bg-white dark:bg-gray-700 text-gray-900 dark:text-white"
                                        placeholder="至少6个字符"
                                    />
                                </div>

                                <div>
                                    <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
                                        确认密码
                                    </label>
                                    <input
                                        type="password"
                                        className="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500 bg-white dark:bg-gray-700 text-gray-900 dark:text-white"
                                        placeholder="再次输入密码"
                                    />
                                </div>

                                <div>
                                    <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
                                        手机号
                                    </label>
                                    <input
                                        type="tel"
                                        className="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500 bg-white dark:bg-gray-700 text-gray-900 dark:text-white"
                                        placeholder="13800138000"
                                    />
                                </div>
                            </form>

                            <div className="mt-4 p-3 bg-orange-50 dark:bg-orange-900/20 rounded-lg text-sm">
                                <div className="text-orange-900 dark:text-orange-300 font-semibold mb-2">
                                    ⚠️ 缺点
                                </div>
                                <ul className="text-orange-800 dark:text-orange-400 space-y-1">
                                    <li>• 需要为每个输入框单独绑定事件</li>
                                    <li>• 父容器无法监听子元素焦点</li>
                                    <li>• 动态元素需要重新绑定事件</li>
                                    <li>• 代码冗余，维护成本高</li>
                                </ul>
                            </div>
                        </div>

                        {/* Right - Event Logs */}
                        <div className="bg-white dark:bg-gray-800 rounded-lg shadow-lg p-6">
                            <div className="flex justify-between items-center mb-4">
                                <h2 className="text-xl font-semibold text-gray-900 dark:text-white">
                                    事件日志
                                </h2>
                                <button
                                    onClick={clearLogs}
                                    className="px-3 py-1 text-sm bg-red-500 hover:bg-red-600 text-white rounded-lg transition-colors"
                                >
                                    清空
                                </button>
                            </div>

                            {focusedField && (
                                <div className="mb-4 p-3 bg-blue-50 dark:bg-blue-900/20 rounded-lg border-l-4 border-blue-500">
                                    <div className="text-sm text-blue-900 dark:text-blue-300 font-semibold">
                                        当前焦点字段
                                    </div>
                                    <div className="text-blue-700 dark:text-blue-400 font-mono">
                                        {getFieldLabel(focusedField)}
                                    </div>
                                </div>
                            )}

                            <div className="h-[520px] overflow-y-auto bg-gray-50 dark:bg-gray-900 rounded-lg p-3 font-mono text-xs">
                                {logs.length === 0 ? (
                                    <div className="text-center text-gray-400 dark:text-gray-600 mt-8">
                                        填写表单查看事件日志...
                                    </div>
                                ) : (
                                    <div className="space-y-2">
                                        {logs.map((log) => (
                                            <div
                                                key={log.id}
                                                className="p-2 bg-white dark:bg-gray-800 rounded border-l-4 border-gray-300 dark:border-gray-600 animate-fade-in"
                                            >
                                                <div className={`${getLogColor(log.type)} font-semibold`}>
                                                    {log.message}
                                                </div>
                                                <div className="text-gray-500 dark:text-gray-500 text-xs mt-1">
                                                    {log.time}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>

                    {/* Summary */}
                    <div className="mt-8 bg-gradient-to-r from-indigo-50 via-purple-50 to-pink-50 dark:from-indigo-900/20 dark:via-purple-900/20 dark:to-pink-900/20 rounded-lg p-6">
                        <h3 className="text-lg font-semibold text-gray-900 dark:text-white mb-4">
                            💡 关键要点总结
                        </h3>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4 text-sm">
                            <div className="bg-white/50 dark:bg-gray-800/50 rounded-lg p-4">
                                <h4 className="font-semibold text-gray-900 dark:text-white mb-2">事件委托</h4>
                                <p className="text-gray-700 dark:text-gray-300">
                                    focusin/focusout 支持冒泡，可以在父元素上统一处理所有子元素的焦点事件，这就是事件委托的应用
                                </p>
                            </div>
                            <div className="bg-white/50 dark:bg-gray-800/50 rounded-lg p-4">
                                <h4 className="font-semibold text-gray-900 dark:text-white mb-2">动态内容</h4>
                                <p className="text-gray-700 dark:text-gray-300">
                                    使用 focusin/focusout 时，即使动态添加新的表单元素，也会自动被父元素的事件监听器捕获
                                </p>
                            </div>
                            <div className="bg-white/50 dark:bg-gray-800/50 rounded-lg p-4">
                                <h4 className="font-semibold text-gray-900 dark:text-white mb-2">代码维护</h4>
                                <p className="text-gray-700 dark:text-gray-300">
                                    集中管理焦点事件使代码更简洁、更易维护，特别适合复杂的表单验证和交互场景
                                </p>
                            </div>
                        </div>
                    </div>

                    <style>{`
                        @keyframes fade-in {
                            from {
                                opacity: 0;
                                transform: translateY(-5px);
                            }
                            to {
                                opacity: 1;
                                transform: translateY(0);
                            }
                        }
                        .animate-fade-in {
                            animation: fade-in 0.2s ease-out;
                        }
                    `}</style>
                </div>
            );
        }

        ReactDOM.render(<PracticalDemo />, document.getElementById('root'));
    </script>
</body>
</html>
