<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSS corner-shape - Radius Required</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #1b2634;
      background: #eef3f6;
    }

    main {
      width: min(900px, calc(100vw - 32px));
      padding: 32px;
      border: 1px solid #c5d1d8;
      background: #ffffff;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 28px;
      letter-spacing: 0;
    }

    p {
      margin: 0 0 26px;
      color: #526170;
      line-height: 1.7;
    }

    .row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px;
    }

    .case {
      padding: 18px;
      border: 1px solid #d4dde2;
      background: #f9fbfc;
    }

    .box {
      height: 148px;
      display: grid;
      place-items: center;
      margin-bottom: 12px;
      border: 8px solid #3a506b;
      corner-shape: scoop;
      background: #f4a261;
      color: #2b2118;
      font-weight: 800;
    }

    .radius-none {
      border-radius: 0;
    }

    .radius-small {
      border-radius: 18px;
    }

    .radius-large {
      border-radius: 48px;
    }

    code {
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 13px;
    }

    .notice {
      display: none;
      margin-top: 20px;
      padding: 12px;
      border: 1px solid #e2b84d;
      background: #fff4cc;
      color: #614800;
    }

    @supports not (corner-shape: scoop) {
      .notice {
        display: block;
      }
    }

    @media (max-width: 720px) {
      .row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1><code>border-radius</code> 必须非零</h1>
    <p>这个页面故意让三个元素都写 <code>corner-shape: scoop</code>。第一个没有圆角，所以角区域大小为 0，<code>corner-shape</code> 没有任何地方可以发挥作用。</p>

    <section class="row">
      <div class="case">
        <div class="box radius-none">无效果</div>
        <code>border-radius: 0;<br>corner-shape: scoop;</code>
      </div>
      <div class="case">
        <div class="box radius-small">轻微凹角</div>
        <code>border-radius: 18px;<br>corner-shape: scoop;</code>
      </div>
      <div class="case">
        <div class="box radius-large">明显凹角</div>
        <code>border-radius: 48px;<br>corner-shape: scoop;</code>
      </div>
    </section>

    <div class="notice">当前浏览器可能不支持 <code>corner-shape</code>，因此看不到第二、第三个示例的凹角。</div>
  </main>
</body>
</html>
