<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>02 - 正整数 tabindex（反面教材）</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; line-height: 1.6; }
    h1 { font-size: 1.4rem; }
    .warning { background: #fff3cd; border: 1px solid #ffc107; padding: 12px 16px; border-radius: 6px; margin-bottom: 24px; }
    .form-group { margin: 12px 0; }
    label { display: block; font-size: 0.9rem; color: #555; margin-bottom: 4px; }
    input { padding: 8px 12px; border: 2px solid #ccc; border-radius: 4px; font-size: 1rem; width: 260px; }
    input:focus { outline: 3px solid #0066cc; border-color: #0066cc; }
    .order-badge { display: inline-block; width: 24px; height: 24px; border-radius: 50%;
      background: #0066cc; color: white; font-size: 0.75rem; text-align: center;
      line-height: 24px; margin-right: 8px; }
    .section { margin: 24px 0; padding: 16px; border: 1px solid #ddd; border-radius: 6px; }
    .section h2 { margin: 0 0 12px; font-size: 1rem; }
    .tip { font-size: 0.85rem; color: #888; margin-top: 8px; }
    .dom-order { color: #999; font-size: 0.8rem; }
  </style>
</head>
<body>
  <h1>正整数 tabindex — 为什么不推荐</h1>

  <div class="warning">
    ⚠️ 本页演示正整数 tabindex 的问题。按 <kbd>Tab</kbd> 键观察焦点跳转顺序，
    它与视觉顺序和 DOM 顺序都不一致，容易让用户困惑。
  </div>

  <div class="section">
    <h2>视觉顺序 vs Tab 顺序（不一致！）</h2>
    <p class="tip">下面的输入框按视觉从上到下排列，但 Tab 顺序被正整数打乱了：</p>

    <div class="form-group">
      <label>
        <span class="dom-order">DOM 第1个 / tabindex=3</span><br>
        <span class="order-badge">3</span>
        <input tabindex="3" placeholder="Tab 顺序：第 3 个">
      </label>
    </div>
    <div class="form-group">
      <label>
        <span class="dom-order">DOM 第2个 / tabindex=1</span><br>
        <span class="order-badge">1</span>
        <input tabindex="1" placeholder="Tab 顺序：第 1 个">
      </label>
    </div>
    <div class="form-group">
      <label>
        <span class="dom-order">DOM 第3个 / tabindex=4</span><br>
        <span class="order-badge">4</span>
        <input tabindex="4" placeholder="Tab 顺序：第 4 个">
      </label>
    </div>
    <div class="form-group">
      <label>
        <span class="dom-order">DOM 第4个 / tabindex=2</span><br>
        <span class="order-badge">2</span>
        <input tabindex="2" placeholder="Tab 顺序：第 2 个">
      </label>
    </div>
  </div>

  <div class="section">
    <h2>正确做法：调整 DOM 顺序</h2>
    <p class="tip">把元素按期望的 Tab 顺序排列在 DOM 中，配合 CSS 控制视觉布局，无需正整数 tabindex。</p>
    <div class="form-group">
      <label>第 1 个（DOM 顺序 = Tab 顺序）<br>
        <input placeholder="自然顺序 1">
      </label>
    </div>
    <div class="form-group">
      <label>第 2 个<br>
        <input placeholder="自然顺序 2">
      </label>
    </div>
    <div class="form-group">
      <label>第 3 个<br>
        <input placeholder="自然顺序 3">
      </label>
    </div>
  </div>
</body>
</html>
