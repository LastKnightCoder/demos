<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>View Transition - 卡片展开详情</title>
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --surface: oklch(0.96 0.005 80);
      --surface-card: oklch(1 0 0);
      --text-primary: oklch(0.18 0.01 260);
      --text-secondary: oklch(0.5 0.008 260);
      --accent: oklch(0.58 0.2 15);
      --radius: 16px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--surface);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 3rem 1.5rem;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 3rem;
    }

    .header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 0.5rem;
    }

    .header p {
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    /* Grid View */
    .grid-view {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 1.25rem;
    }

    .card {
      background: var(--surface-card);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      transition: box-shadow 0.2s ease, transform 0.2s ease;
      box-shadow: 0 1px 3px oklch(0.2 0 0 / 0.06), 0 4px 12px oklch(0.2 0 0 / 0.04);
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px oklch(0.2 0 0 / 0.1);
    }

    .card-image {
      width: 100%;
      height: 180px;
      object-fit: cover;
      display: block;
    }

    .card-body {
      padding: 1.25rem;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 0.4rem;
    }

    .card-desc {
      font-size: 0.82rem;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    .card-tag {
      display: inline-block;
      margin-top: 0.75rem;
      padding: 0.25rem 0.6rem;
      background: oklch(0.95 0.02 15);
      color: var(--accent);
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 600;
    }

    /* Detail View */
    .detail-view {
      display: none;
      background: var(--surface-card);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 4px 24px oklch(0.2 0 0 / 0.08);
    }

    .detail-view.active {
      display: block;
    }

    .detail-image {
      width: 100%;
      height: 360px;
      object-fit: cover;
      display: block;
    }

    .detail-body {
      padding: 2.5rem;
    }

    .detail-title {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 1rem;
    }

    .detail-text {
      color: var(--text-secondary);
      line-height: 1.8;
      font-size: 0.95rem;
      max-width: 60ch;
    }

    .detail-meta {
      display: flex;
      gap: 1.5rem;
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid oklch(0.9 0.005 80);
    }

    .meta-item {
      font-size: 0.8rem;
    }

    .meta-label {
      color: var(--text-secondary);
      margin-bottom: 0.2rem;
    }

    .meta-value {
      font-weight: 600;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      margin-bottom: 1.5rem;
      padding: 0.5rem 1rem;
      border: none;
      background: var(--surface);
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-primary);
      cursor: pointer;
      transition: background 0.15s;
    }

    .back-btn:hover {
      background: oklch(0.92 0.008 80);
    }

    .grid-view.hidden {
      display: none;
    }

    /* View Transition Styles */
    ::view-transition-group(detail-image) {
      animation-duration: 0.35s;
      animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1);
    }

    ::view-transition-group(detail-title) {
      animation-duration: 0.35s;
      animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1);
    }

    ::view-transition-old(root) {
      animation-duration: 0.25s;
      animation-timing-function: ease-out;
    }

    ::view-transition-new(root) {
      animation-duration: 0.35s;
      animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1);
    }

    @media (prefers-reduced-motion: reduce) {
      ::view-transition-group(*),
      ::view-transition-old(*),
      ::view-transition-new(*) {
        animation-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>卡片展开详情</h1>
      <p>点击卡片，图片和标题会"飞入"详情视图的对应位置</p>
    </div>

    <div class="grid-view" id="gridView">
    </div>

    <div class="detail-view" id="detailView">
      <button class="back-btn" onclick="goBack()">← 返回列表</button>
      <img class="detail-image" id="detailImage" src="" alt="">
      <div class="detail-body">
        <h2 class="detail-title" id="detailTitle"></h2>
        <p class="detail-text" id="detailText"></p>
        <div class="detail-meta">
          <div class="meta-item">
            <div class="meta-label">技术</div>
            <div class="meta-value" id="detailTech"></div>
          </div>
          <div class="meta-item">
            <div class="meta-label">难度</div>
            <div class="meta-value" id="detailDifficulty"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const projects = [
      {
        id: 'aurora',
        title: '极光粒子系统',
        desc: '基于 WebGL 的极光粒子效果模拟',
        image: 'https://images.unsplash.com/photo-1531366936337-7c912a4589a7?w=600&h=400&fit=crop',
        fullText: '使用 WebGL 和自定义着色器实现的极光效果。每个粒子遵循 Perlin 噪声场运动，色彩基于高度和速度动态混合。支持触摸交互，拖拽可以扰动粒子流场。',
        tech: 'WebGL / GLSL',
        difficulty: '高级',
        tag: 'WebGL'
      },
      {
        id: 'typography',
        title: '流体排版引擎',
        desc: '响应式文字大小与行高的动态计算',
        image: 'https://images.unsplash.com/photo-1467733719364-2c3672e22dd3?w=600&h=400&fit=crop',
        fullText: '一个无依赖的流体排版计算系统，根据视口宽度平滑插值字体大小、行高和字间距。使用 CSS clamp() 和自定义属性实现，支持断点区间自定义。',
        tech: 'CSS / Custom Props',
        difficulty: '中级',
        tag: 'CSS'
      },
      {
        id: 'gesture',
        title: '手势识别引擎',
        desc: '纯 JavaScript 实现的多点触控手势库',
        image: 'https://images.unsplash.com/photo-1558618666-fcd25c85f82e?w=600&h=400&fit=crop',
        fullText: '支持缩放、旋转、滑动、长按等复合手势的识别引擎。使用速度向量追踪和模式匹配算法，可以区分快速滑动和慢速拖拽，并提供惯性滚动计算。',
        tech: 'TypeScript',
        difficulty: '高级',
        tag: 'JavaScript'
      },
      {
        id: 'color',
        title: 'OKLCH 色彩工具',
        desc: '感知均匀色彩空间的可视化操作',
        image: 'https://images.unsplash.com/photo-1525909002-1b05e0c869d8?w=600&h=400&fit=crop',
        fullText: '一个在 OKLCH 色彩空间中操作颜色的工具集。提供色轮选择器、渐变生成器和对比度检查器。所有色彩变换都在感知均匀空间中执行，确保视觉上的一致性。',
        tech: 'Canvas API',
        difficulty: '中级',
        tag: '色彩'
      },
      {
        id: 'physics',
        title: '物理模拟沙盒',
        desc: '基于 Verlet 积分的 2D 物理引擎',
        image: 'https://images.unsplash.com/photo-1635070041078-e363dbe005cb?w=600&h=400&fit=crop',
        fullText: '使用 Verlet 积分法实现的 2D 物理模拟。包括刚体碰撞检测、弹簧约束、布料模拟和流体粒子。所有计算在 Web Worker 中异步执行以保持 UI 响应。',
        tech: 'Web Workers',
        difficulty: '高级',
        tag: '物理'
      },
      {
        id: 'audio',
        title: '音频可视化器',
        desc: 'Web Audio API 频谱分析与实时渲染',
        image: 'https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=600&h=400&fit=crop',
        fullText: '基于 Web Audio API 的实时音频可视化。使用 AnalyserNode 获取频谱数据，通过 Canvas 绘制波形图、频率直方图和辐射状频谱。支持麦克风输入和文件播放两种模式。',
        tech: 'Web Audio API',
        difficulty: '中级',
        tag: '音频'
      }
    ];

    function renderGrid() {
      const grid = document.getElementById('gridView');
      grid.innerHTML = projects.map(p => `
        <div class="card" onclick="openDetail('${p.id}')">
          <img class="card-image" src="${p.image}" alt="${p.title}" id="img-${p.id}">
          <div class="card-body">
            <h3 class="card-title" id="title-${p.id}">${p.title}</h3>
            <p class="card-desc">${p.desc}</p>
            <span class="card-tag">${p.tag}</span>
          </div>
        </div>
      `).join('');
    }

    function openDetail(id) {
      const project = projects.find(p => p.id === id);
      if (!project) return;

      const imgEl = document.getElementById(`img-${id}`);
      const titleEl = document.getElementById(`title-${id}`);

      imgEl.style.viewTransitionName = 'detail-image';
      titleEl.style.viewTransitionName = 'detail-title';

      const transition = document.startViewTransition
        ? document.startViewTransition(() => showDetail(project))
        : (showDetail(project), null);

      if (transition) {
        transition.finished.then(() => {
          imgEl.style.viewTransitionName = '';
          titleEl.style.viewTransitionName = '';
        });
      }
    }

    function showDetail(project) {
      document.getElementById('gridView').classList.add('hidden');

      const detailView = document.getElementById('detailView');
      detailView.classList.add('active');

      const detailImage = document.getElementById('detailImage');
      const detailTitle = document.getElementById('detailTitle');

      detailImage.src = project.image;
      detailImage.style.viewTransitionName = 'detail-image';
      detailTitle.textContent = project.title;
      detailTitle.style.viewTransitionName = 'detail-title';

      document.getElementById('detailText').textContent = project.fullText;
      document.getElementById('detailTech').textContent = project.tech;
      document.getElementById('detailDifficulty').textContent = project.difficulty;
    }

    function goBack() {
      const detailImage = document.getElementById('detailImage');
      const detailTitle = document.getElementById('detailTitle');

      const transition = document.startViewTransition
        ? document.startViewTransition(() => hideDetail())
        : (hideDetail(), null);
    }

    function hideDetail() {
      document.getElementById('detailView').classList.remove('active');
      document.getElementById('gridView').classList.remove('hidden');

      document.getElementById('detailImage').style.viewTransitionName = '';
      document.getElementById('detailTitle').style.viewTransitionName = '';
    }

    renderGrid();
  </script>
</body>
</html>
