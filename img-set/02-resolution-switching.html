<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>image-set() 分辨率切换</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
      background: #f5f5f5;
    }
    h1 { color: #333; }
    .demo-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin: 20px 0;
    }
    .demo-box {
      height: 150px;
      border: 2px solid #333;
      background-color: #fff;
      background-repeat: no-repeat;
      background-position: center;
      background-size: contain;
      border-radius: 8px;
    }
    .demo-label {
      text-align: center;
      margin-top: 10px;
      font-weight: bold;
    }
    /* 1x 分辨率 */
    .res-1x {
      background-image: image-set(url("https://via.placeholder.com/250x150/9b59b6/fff?text=1x+Only") 1x);
    }
    /* 1x 和 2x */
    .res-1x-2x {
      background-image: image-set(
        url("https://via.placeholder.com/250x150/3498db/fff?text=1x") 1x,
        url("https://via.placeholder.com/500x300/e74c3c/fff?text=2x") 2x
      );
    }
    /* 1x, 2x 和 3x */
    .res-1x-2x-3x {
      background-image: image-set(
        url("https://via.placeholder.com/250x150/3498db/fff?text=1x") 1x,
        url("https://via.placeholder.com/500x300/e74c3c/fff?text=2x") 2x,
        url("https://via.placeholder.com/750x450/27ae60/fff?text=3x") 3x
      );
    }
</style>
</head>
<body>
  <h1>image-set() 分辨率切换演示</h1>

  <p>浏览器会根据设备像素比自动选择最合适的图像版本。</p>

  <div class="demo-container">
    <div>
      <div class="demo-box res-1x"></div>
      <p class="demo-label">仅 1x</p>
    </div>
    <div>
      <div class="demo-box res-1x-2x"></div>
      <p class="demo-label">1x / 2x</p>
    </div>
    <div>
      <div class="demo-box res-1x-2x-3x"></div>
      <p class="demo-label">1x / 2x / 3x</p>
    </div>
  </div>

  <h2>分辨率单位对比</h2>
  <table style="width:100%; border-collapse: collapse; margin: 20px 0;">
    <tr style="background: #333; color: #fff;">
      <th style="padding: 10px; border: 1px solid #333;">单位</th>
      <th style="padding: 10px; border: 1px solid #333;">说明</th>
      <th style="padding: 10px; border: 1px solid #333;">等价关系</th>
    </tr>
    <tr>
      <td style="padding: 10px; border: 1px solid #ddd;"><code>1x</code></td>
      <td style="padding: 10px; border: 1px solid #ddd;">标准分辨率</td>
      <td style="padding: 10px; border: 1px solid #ddd;">= 1dppx = 96dpi</td>
    </tr>
    <tr style="background: #f9f9f9;">
      <td style="padding: 10px; border: 1px solid #ddd;"><code>2x</code></td>
      <td style="padding: 10px; border: 1px solid #ddd;">Retina/高清屏</td>
      <td style="padding: 10px; border: 1px solid #ddd;">= 2dppx = 192dpi</td>
    </tr>
    <tr>
      <td style="padding: 10px; border: 1px solid #ddd;"><code>3x</code></td>
      <td style="padding: 10px; border: 1px solid #ddd;">超高清屏</td>
      <td style="padding: 10px; border: 1px solid #ddd;">= 3dppx = 288dpi</td>
    </tr>
  </table>

  <p id="current-dpr" style="background: #e8f5e9; padding: 15px; border-radius: 5px;"></p>

  <script>
    document.getElementById('current-dpr').innerHTML =
      `当前设备像素比: <strong>${window.devicePixelRatio}</strong>`;
  </script>
</body>
</html>
