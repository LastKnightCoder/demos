<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSS Scroll Snap - Horizontal Cards</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #17212b;
      background: #edf4f2;
    }

    main {
      width: min(980px, calc(100vw - 32px));
      padding: 32px;
      border: 1px solid #c3d8d1;
      background: #fbfffd;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 28px;
      letter-spacing: 0;
    }

    p {
      margin: 0 0 24px;
      color: #52635f;
      line-height: 1.7;
    }

    .scroller {
      display: flex;
      gap: 18px;
      overflow-x: auto;
      overscroll-behavior-inline: contain;
      scroll-snap-type: x mandatory;
      scroll-padding-inline: 24px;
      padding: 24px;
      border: 1px solid #b6cec6;
      background:
        linear-gradient(90deg, rgb(13 148 136 / 18%) 0 2px, transparent 2px) 24px 0 / 100% 100% no-repeat,
        #f7fbfa;
    }

    .card {
      flex: 0 0 min(360px, 78vw);
      min-height: 260px;
      scroll-snap-align: start;
      padding: 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid #d7e4df;
      background: #ffffff;
      box-shadow: 0 14px 34px rgb(38 67 60 / 12%);
    }

    .card strong {
      display: block;
      font-size: 42px;
      line-height: 1;
      color: #0f766e;
    }

    .card h2 {
      margin: 20px 0 8px;
      font-size: 22px;
      letter-spacing: 0;
    }

    .card p {
      margin: 0;
      color: #50625e;
    }

    code {
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      color: #0f766e;
    }
  </style>
</head>
<body>
  <main>
    <h1>横向卡片吸附</h1>
    <p>滚动容器使用 <code>scroll-snap-type: x mandatory</code>，每张卡片使用 <code>scroll-snap-align: start</code>。拖动或使用触控板横向滚动，松手后卡片会对齐到左侧参考线。</p>

    <section class="scroller" aria-label="横向滚动卡片">
      <article class="card">
        <div>
          <strong>01</strong>
          <h2>容器开启吸附</h2>
          <p><code>scroll-snap-type</code> 写在真正滚动的元素上。</p>
        </div>
      </article>
      <article class="card">
        <div>
          <strong>02</strong>
          <h2>子项声明对齐</h2>
          <p><code>scroll-snap-align: start</code> 让卡片左侧对齐容器 snapport 的左侧。</p>
        </div>
      </article>
      <article class="card">
        <div>
          <strong>03</strong>
          <h2>保留原生滚动</h2>
          <p>滚动条、触摸惯性、键盘滚动仍由浏览器处理。</p>
        </div>
      </article>
      <article class="card">
        <div>
          <strong>04</strong>
          <h2>适合卡片列表</h2>
          <p>移动端横向推荐列表、产品卡片、步骤卡片都很常见。</p>
        </div>
      </article>
    </section>
  </main>
</body>
</html>
