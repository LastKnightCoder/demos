<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSS Scroll Snap - Snap Stop</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #111827;
      background: #eef2ff;
    }

    main {
      width: min(980px, calc(100vw - 32px));
      padding: 32px;
      border: 1px solid #c7d2fe;
      background: #ffffff;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 28px;
      letter-spacing: 0;
    }

    p {
      margin: 0 0 24px;
      color: #4b5563;
      line-height: 1.7;
    }

    .rail {
      display: flex;
      gap: 16px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-padding-inline: 28px;
      padding: 28px;
      border: 1px solid #c7d2fe;
      background: #f8faff;
    }

    .step {
      flex: 0 0 min(300px, 76vw);
      min-height: 250px;
      scroll-snap-align: center;
      padding: 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid #d9defe;
      background: #ffffff;
    }

    .step.important {
      scroll-snap-stop: always;
      border-color: #4338ca;
      background: #eef2ff;
      box-shadow: inset 0 0 0 3px rgb(67 56 202 / 18%);
    }

    .number {
      font-size: 48px;
      font-weight: 900;
      color: #4f46e5;
      line-height: 1;
    }

    h2 {
      margin: 18px 0 8px;
      font-size: 22px;
      letter-spacing: 0;
    }

    .step p {
      margin: 0;
    }

    code {
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      color: #4338ca;
    }
  </style>
</head>
<body>
  <main>
    <h1>scroll-snap-stop</h1>
    <p>快速横向滑动这组步骤。带紫色描边的关键步骤设置了 <code>scroll-snap-stop: always</code>，浏览器会尽量避免一次快速滚动直接越过它。</p>

    <section class="rail" aria-label="步骤列表">
      <article class="step">
        <div>
          <div class="number">01</div>
          <h2>普通步骤</h2>
          <p>默认是 <code>scroll-snap-stop: normal</code>。</p>
        </div>
      </article>
      <article class="step">
        <div>
          <div class="number">02</div>
          <h2>普通步骤</h2>
          <p>快速滚动时，中间普通吸附点可能被跳过。</p>
        </div>
      </article>
      <article class="step important">
        <div>
          <div class="number">03</div>
          <h2>关键步骤</h2>
          <p>这个元素使用 <code>scroll-snap-stop: always</code>。</p>
        </div>
      </article>
      <article class="step">
        <div>
          <div class="number">04</div>
          <h2>普通步骤</h2>
          <p><code>always</code> 不是锁定滚动，用户仍然可以继续滑动。</p>
        </div>
      </article>
      <article class="step important">
        <div>
          <div class="number">05</div>
          <h2>关键步骤</h2>
          <p>适合不希望用户一次滑过的重要内容。</p>
        </div>
      </article>
    </section>
  </main>
</body>
</html>
