<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSS Scroll Snap - Two Axis Gallery</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #edf7f8;
    }

    .shell {
      height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    header {
      padding: 18px 24px;
      border-bottom: 1px solid #bdd9de;
      background: #fbffff;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 26px;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      color: #52666b;
      line-height: 1.6;
    }

    .gallery {
      overflow: auto;
      scroll-snap-type: both mandatory;
      scroll-padding: 32px;
      padding: 32px;
      background:
        linear-gradient(#d3e8eb 1px, transparent 1px),
        linear-gradient(90deg, #d3e8eb 1px, transparent 1px),
        #edf7f8;
      background-size: 80px 80px;
    }

    .grid {
      width: max-content;
      display: grid;
      grid-template-columns: repeat(4, min(520px, 82vw));
      grid-auto-rows: min(340px, 68vh);
      gap: 24px;
    }

    .tile {
      scroll-snap-align: center;
      display: grid;
      place-items: center;
      padding: 24px;
      border: 1px solid #a9cbd1;
      background: #ffffff;
      box-shadow: 0 20px 46px rgb(23 63 72 / 14%);
    }

    .tile:nth-child(4n + 1) {
      background: #ffffff;
    }

    .tile:nth-child(4n + 2) {
      background: #f0fdf4;
    }

    .tile:nth-child(4n + 3) {
      background: #fff7ed;
    }

    .tile:nth-child(4n) {
      background: #f5f3ff;
    }

    .tile span {
      display: block;
      font-size: clamp(40px, 8vw, 88px);
      font-weight: 900;
      color: #0f766e;
      line-height: 1;
    }

    .tile small {
      display: block;
      margin-top: 14px;
      color: #596a70;
      font-size: 16px;
    }

    code {
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      color: #0f766e;
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <h1>双轴 Scroll Snap</h1>
      <p>画廊容器使用 <code>scroll-snap-type: both mandatory</code>。你可以横向和纵向滚动，卡片会尽量吸附到视口中心。</p>
    </header>

    <main class="gallery" aria-label="双轴滚动画廊">
      <div class="grid">
        <section class="tile"><div><span>A1</span><small>scroll-snap-align: center</small></div></section>
        <section class="tile"><div><span>A2</span><small>横向吸附</small></div></section>
        <section class="tile"><div><span>A3</span><small>横向吸附</small></div></section>
        <section class="tile"><div><span>A4</span><small>横向吸附</small></div></section>
        <section class="tile"><div><span>B1</span><small>纵向吸附</small></div></section>
        <section class="tile"><div><span>B2</span><small>双轴中心对齐</small></div></section>
        <section class="tile"><div><span>B3</span><small>双轴中心对齐</small></div></section>
        <section class="tile"><div><span>B4</span><small>双轴中心对齐</small></div></section>
        <section class="tile"><div><span>C1</span><small>纵向吸附</small></div></section>
        <section class="tile"><div><span>C2</span><small>双轴中心对齐</small></div></section>
        <section class="tile"><div><span>C3</span><small>双轴中心对齐</small></div></section>
        <section class="tile"><div><span>C4</span><small>双轴中心对齐</small></div></section>
      </div>
    </main>
  </div>
</body>
</html>
