<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>View Transition Demo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #ffffff;
      --text: #18181b;
      --text-secondary: #52525b;
      --text-muted: #a1a1aa;
      --btn-bg: #f4f4f5;
      --btn-text: #3f3f46;
      --hover-bg: #f4f4f5;
    }

    .dark {
      --bg: #09090b;
      --text: #fafafa;
      --text-secondary: #a1a1aa;
      --text-muted: #71717a;
      --btn-bg: #27272a;
      --btn-text: #d4d4d8;
      --hover-bg: #27272a;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 20px;
    }

    .list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    @media (max-width: 480px) {
      .list {
        grid-template-columns: 1fr;
      }
    }

    .list-item {
      display: flex;
      gap: 12px;
      padding: 10px;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .list-item:hover {
      background: var(--hover-bg);
    }

    .list-item img {
      width: 96px;
      height: 96px;
      border-radius: 8px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .list-item-info {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .list-item-title {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      line-height: 1.4;
    }

    .list-item-desc {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .detail {
      border-radius: 12px;
      overflow: hidden;
    }

    .detail img {
      width: 100%;
      height: 280px;
      object-fit: cover;
      display: block;
      border-radius: 12px;
    }

    .detail-body {
      padding: 20px 0;
    }

    .detail-title {
      display: block;
      font-size: 20px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 8px;
      line-height: 1.4;
    }

    .detail-desc {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 20px;
      line-height: 1.6;
    }

    .back-btn {
      padding: 8px 20px;
      border-radius: 8px;
      font-size: 14px;
      border: none;
      cursor: pointer;
      background: var(--btn-bg);
      color: var(--btn-text);
      transition: opacity 0.2s;
    }

    .back-btn:hover {
      opacity: 0.8;
    }

    .hero-1 { view-transition-name: hero-1; }
    .hero-2 { view-transition-name: hero-2; }
    .hero-3 { view-transition-name: hero-3; }
    .hero-4 { view-transition-name: hero-4; }

    /* 关键：让截图在 group 尺寸变化时保持 cover 裁剪，而不是被拉伸 */
    ::view-transition-old(hero-1),
    ::view-transition-new(hero-1),
    ::view-transition-old(hero-2),
    ::view-transition-new(hero-2),
    ::view-transition-old(hero-3),
    ::view-transition-new(hero-3),
    ::view-transition-old(hero-4),
    ::view-transition-new(hero-4) {
      object-fit: cover;
      overflow: hidden;
    }

    ::view-transition-image-pair(hero-1),
    ::view-transition-image-pair(hero-2),
    ::view-transition-image-pair(hero-3),
    ::view-transition-image-pair(hero-4) {
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    const params = new URLSearchParams(window.location.search);
    if (params.get('dark') === '1') {
      document.documentElement.classList.add('dark');
    }

    const images = [
      { id: 1, src: "https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=800&h=600&fit=crop", title: "阿尔卑斯山脉" },
      { id: 2, src: "https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=800&h=600&fit=crop", title: "湖畔日落" },
      { id: 3, src: "https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=800&h=600&fit=crop", title: "森林晨雾" },
      { id: 4, src: "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=800&h=600&fit=crop", title: "林间小径" },
    ];

    const app = document.getElementById('app');

    function renderList() {
      app.innerHTML = `
        <div class="list">
          ${images.map(item => `
            <div class="list-item" data-id="${item.id}">
              <img class="hero-${item.id}" src="${item.src}" alt="${item.title}" />
              <div class="list-item-info">
                <span class="list-item-title">${item.title}</span>
                <span class="list-item-desc">点击查看详情</span>
              </div>
            </div>
          `).join('')}
        </div>
      `;

      app.querySelectorAll('.list-item').forEach(el => {
        el.addEventListener('click', () => {
          const id = Number(el.dataset.id);
          const item = images.find(i => i.id === id);
          if (item) goDetail(item);
        });
      });
    }

    function renderDetail(item) {
      app.innerHTML = `
        <div class="detail">
          <img class="hero-${item.id}" src="${item.src}" alt="${item.title}" />
          <div class="detail-body">
            <span class="detail-title">${item.title}</span>
            <p class="detail-desc">这是详情页的描述内容。图片从列表中的缩略图位置，平滑过渡放大到顶部的大尺寸头图。这就是 View Transition API 带来的原生过渡动画能力。</p>
            <button class="back-btn" id="back-btn">← 返回列表</button>
          </div>
        </div>
      `;

      document.getElementById('back-btn').addEventListener('click', goBack);
    }

    function goDetail(item) {
      if (!document.startViewTransition) {
        renderDetail(item);
        return;
      }
      document.startViewTransition(() => {
        renderDetail(item);
      });
    }

    function goBack() {
      if (!document.startViewTransition) {
        renderList();
        return;
      }
      document.startViewTransition(() => {
        renderList();
      });
    }

    renderList();
  </script>
</body>
</html>
