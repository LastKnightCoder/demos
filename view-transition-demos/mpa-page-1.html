<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>页面 A - 文章列表</title>
  <style>
    @view-transition {
      navigation: auto;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #ffffff;
      --text: #18181b;
      --text-secondary: #52525b;
      --text-muted: #a1a1aa;
      --card-bg: #f9fafb;
      --border: #e4e4e7;
      --btn-bg: #18181b;
      --btn-text: #ffffff;
    }

    .dark {
      --bg: #09090b;
      --text: #fafafa;
      --text-secondary: #a1a1aa;
      --text-muted: #71717a;
      --card-bg: #18181b;
      --border: #27272a;
      --btn-bg: #fafafa;
      --btn-text: #09090b;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 32px 24px;
      min-height: 100vh;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 20px;
      view-transition-name: page-title;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .card:hover {
      opacity: 0.8;
    }

    .card-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text);
    }

    .card-desc {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    .card-meta {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 8px;
    }

    .hero-img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 12px;
      view-transition-name: hero-img;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>文章列表</h1>
    <img class="hero-img" src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=800&h=400&fit=crop" alt="cover" />
    <div class="card" id="go">
      <div class="card-title">View Transition API 完全指南</div>
      <div class="card-desc">深入了解浏览器原生的视图过渡机制，从单页面到跨页面的平滑动画实现。</div>
      <div class="card-meta">点击前往详情 →</div>
    </div>
    <div class="card">
      <div class="card-title">CSS Container Queries 实战</div>
      <div class="card-desc">组件级响应式设计的新范式。</div>
      <div class="card-meta">2024-01-15</div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const isDark = params.get('dark') === '1';
    if (isDark) document.documentElement.classList.add('dark');

    document.getElementById('go').addEventListener('click', () => {
      const darkParam = isDark ? '?dark=1' : '';
      window.location.href = `mpa-page-2.html${darkParam}`;
    });
  </script>
</body>
</html>
