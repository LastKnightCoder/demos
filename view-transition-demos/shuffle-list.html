<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>View Transition - 列表随机打乱</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #ffffff;
      --text: #18181b;
      --text-muted: #71717a;
      --item-bg: #f9fafb;
      --btn-bg: #18181b;
      --btn-text: #ffffff;
      --btn-hover: #3f3f46;
      --border: #e4e4e7;
    }

    .dark {
      --bg: #09090b;
      --text: #fafafa;
      --text-muted: #a1a1aa;
      --item-bg: #18181b;
      --btn-bg: #fafafa;
      --btn-text: #09090b;
      --btn-hover: #d4d4d8;
      --border: #27272a;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 400px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .header h3 {
      font-size: 16px;
      font-weight: 600;
    }

    .shuffle-btn {
      padding: 8px 16px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      background: var(--btn-bg);
      color: var(--btn-text);
      transition: background 0.2s;
    }

    .shuffle-btn:hover {
      background: var(--btn-hover);
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-radius: 10px;
      background: var(--item-bg);
      border: 1px solid var(--border);
    }

    .item-rank {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--btn-bg);
      color: var(--btn-text);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 600;
      flex-shrink: 0;
    }

    .item-info {
      display: flex;
      flex-direction: column;
    }

    .item-name {
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
    }

    .item-desc {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h3>排行榜</h3>
      <button class="shuffle-btn" id="shuffle">🎲 随机打乱</button>
    </div>
    <div class="list" id="list"></div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    if (params.get('dark') === '1') {
      document.documentElement.classList.add('dark');
    }

    let items = [
      { id: 1, name: "TypeScript", desc: "类型安全的 JavaScript" },
      { id: 2, name: "Rust", desc: "系统级编程语言" },
      { id: 3, name: "Go", desc: "简洁高效的后端语言" },
      { id: 4, name: "Python", desc: "万能的脚本语言" },
      { id: 5, name: "Swift", desc: "Apple 生态的首选" },
      { id: 6, name: "Kotlin", desc: "现代化的 JVM 语言" },
    ];

    const listEl = document.getElementById('list');

    function render() {
      listEl.innerHTML = items.map((item, index) => `
        <div class="item" style="view-transition-name: item-${item.id};">
          <div class="item-rank">${index + 1}</div>
          <div class="item-info">
            <span class="item-name">${item.name}</span>
            <span class="item-desc">${item.desc}</span>
          </div>
        </div>
      `).join('');
    }

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    document.getElementById('shuffle').addEventListener('click', () => {
      shuffle(items);
      if (!document.startViewTransition) {
        render();
        return;
      }
      document.startViewTransition(() => render());
    });

    render();
  </script>
</body>
</html>
