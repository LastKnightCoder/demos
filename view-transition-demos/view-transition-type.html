<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>view-transition-type Demo</title>
  <style>
    :root {
      --bg: #ffffff;
      --card-bg: #f5f5f5;
      --text: #1a1a1a;
      --text-secondary: #666666;
      --btn-bg: #f0f0f0;
      --btn-hover: #e0e0e0;
      --btn-active: #d0d0d0;
      --dot-inactive: #d0d0d0;
      --dot-active: #333333;
    }

    .dark {
      --bg: #1a1a1a;
      --card-bg: #2a2a2a;
      --text: #e5e5e5;
      --text-secondary: #999999;
      --btn-bg: #333333;
      --btn-hover: #444444;
      --btn-active: #555555;
      --dot-inactive: #555555;
      --dot-active: #e5e5e5;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .slider { width: 100%; max-width: 560px; }

    .slide-container {
      width: 100%;
      aspect-ratio: 4 / 3;
      border-radius: 12px;
      overflow: hidden;
      background: var(--card-bg);
      view-transition-name: slide;
    }

    .slide-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .slide-info {
      text-align: center;
      margin-top: 16px;
      font-size: 15px;
      color: var(--text-secondary);
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-top: 20px;
    }

    .controls button {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: var(--btn-bg);
      color: var(--text);
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .controls button:hover { background: var(--btn-hover); }
    .controls button:active { background: var(--btn-active); }

    .dots { display: flex; gap: 8px; }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--dot-inactive);
      transition: background 0.2s;
    }

    .dot.active { background: var(--dot-active); }

    /* slide 过渡保持圆角，允许溢出（推挤时 new 从外部进入） */
    ::view-transition-group(slide) {
      overflow: hidden;
      border-radius: 12px;
    }

    ::view-transition-image-pair(slide) {
      isolation: auto;
      overflow: visible;
    }

    /* 下一张：整体向左推 */
    html:active-view-transition-type(slide-forward) {
      &::view-transition-old(slide) {
        animation: 0.4s cubic-bezier(0.22, 1, 0.36, 1) both push-out-left;
      }
      &::view-transition-new(slide) {
        animation: 0.4s cubic-bezier(0.22, 1, 0.36, 1) both push-in-from-right;
      }
    }

    /* 上一张：整体向右推 */
    html:active-view-transition-type(slide-back) {
      &::view-transition-old(slide) {
        animation: 0.4s cubic-bezier(0.22, 1, 0.36, 1) both push-out-right;
      }
      &::view-transition-new(slide) {
        animation: 0.4s cubic-bezier(0.22, 1, 0.36, 1) both push-in-from-left;
      }
    }

    @keyframes push-out-left {
      from { transform: translateX(0); }
      to { transform: translateX(-100%); }
    }
    @keyframes push-in-from-right {
      from { transform: translateX(100%); }
      to { transform: translateX(0); }
    }
    @keyframes push-out-right {
      from { transform: translateX(0); }
      to { transform: translateX(100%); }
    }
    @keyframes push-in-from-left {
      from { transform: translateX(-100%); }
      to { transform: translateX(0); }
    }
  </style>
</head>
<body>
  <div class="slider">
    <div class="slide-container">
      <img id="slideImg" src="" alt="">
    </div>
    <div class="slide-info" id="slideInfo"></div>
    <div class="controls">
      <button id="prev">←</button>
      <div class="dots" id="dots"></div>
      <button id="next">→</button>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    if (params.get('dark') === '1') {
      document.documentElement.classList.add('dark');
    }

    const slides = [
      { src: "https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=800&h=600&fit=crop", title: "阿尔卑斯山脉" },
      { src: "https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=800&h=600&fit=crop", title: "湖畔日落" },
      { src: "https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=800&h=600&fit=crop", title: "森林晨雾" },
      { src: "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=800&h=600&fit=crop", title: "林间小径" },
    ];

    let current = 0;
    const slideImg = document.getElementById('slideImg');
    const slideInfo = document.getElementById('slideInfo');
    const dotsContainer = document.getElementById('dots');

    slides.forEach(s => { new Image().src = s.src; });

    slides.forEach((_, i) => {
      const dot = document.createElement('div');
      dot.className = 'dot' + (i === 0 ? ' active' : '');
      dotsContainer.appendChild(dot);
    });

    function render() {
      slideImg.src = slides[current].src;
      slideImg.alt = slides[current].title;
      slideInfo.textContent = `${slides[current].title}（${current + 1} / ${slides.length}）`;
      document.querySelectorAll('.dot').forEach((dot, i) => {
        dot.classList.toggle('active', i === current);
      });
    }

    render();

    document.getElementById('next').addEventListener('click', () => {
      current = (current + 1) % slides.length;
      if (!document.startViewTransition) { render(); return; }
      const t = document.startViewTransition({ update: render, types: ['slide-forward'] });
      t.finished.catch(() => {});
    });

    document.getElementById('prev').addEventListener('click', () => {
      current = (current - 1 + slides.length) % slides.length;
      if (!document.startViewTransition) { render(); return; }
      const t = document.startViewTransition({ update: render, types: ['slide-back'] });
      t.finished.catch(() => {});
    });
  </script>
</body>
</html>
