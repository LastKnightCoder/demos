<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>View Transition - 主题切换</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #ffffff;
      --card-bg: #f9fafb;
      --text: #18181b;
      --text-secondary: #52525b;
      --text-muted: #a1a1aa;
      --border: #e4e4e7;
      --btn-bg: #18181b;
      --btn-text: #ffffff;
    }

    .dark {
      --bg: #09090b;
      --card-bg: #18181b;
      --text: #fafafa;
      --text-secondary: #a1a1aa;
      --text-muted: #71717a;
      --border: #27272a;
      --btn-bg: #fafafa;
      --btn-text: #09090b;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      transition: none;
    }

    .container {
      width: 100%;
      max-width: 420px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .header h3 {
      font-size: 18px;
      font-weight: 600;
    }

    .toggle-btn {
      padding: 8px 16px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      background: var(--btn-bg);
      color: var(--btn-text);
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 12px;
    }

    .card-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
    }

    .card-desc {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    .tags {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .tag {
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 20px;
      background: var(--border);
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h3>设置</h3>
      <button class="toggle-btn" id="toggle">切换主题</button>
    </div>
    <div class="card">
      <div class="card-title">外观</div>
      <div class="card-desc">当前使用的是系统默认主题配色，点击右上角按钮可以在明暗主题之间切换。</div>
      <div class="tags">
        <span class="tag">主题</span>
        <span class="tag">View Transition</span>
        <span class="tag">cross-fade</span>
      </div>
    </div>
    <div class="card">
      <div class="card-title">关于动画</div>
      <div class="card-desc">切换时浏览器会对整个页面截图，新旧截图之间执行默认的 cross-fade 淡入淡出动画，无需额外代码。</div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    if (params.get('dark') === '1') {
      document.documentElement.classList.add('dark');
    }

    document.getElementById('toggle').addEventListener('click', () => {
      if (!document.startViewTransition) {
        document.documentElement.classList.toggle('dark');
        return;
      }
      document.startViewTransition(() => {
        document.documentElement.classList.toggle('dark');
      });
    });
  </script>
</body>
</html>
