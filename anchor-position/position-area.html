<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>position-area 示例</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --text-muted: #64748b;
    --border:     #e2e8f0;
    --code-bg:    #f1f5f9;
    --code-text:  #475569;
    --code-prop:  #3b82f6;
    --code-val:   #f97316;
    --code-cmt:   #94a3b8;
    --demo-bg:    #f9fafb;
    --btn-bg:     #ffffff;
    --btn-text:   #475569;
    --btn-border: #e2e8f0;
  }

  :root.dark {
    --text-muted: #94a3b8;
    --border:     #334155;
    --code-bg:    #1e293b;
    --code-text:  #94a3b8;
    --code-prop:  #60a5fa;
    --code-val:   #fb923c;
    --code-cmt:   #475569;
    --demo-bg:    #18181b;
    --btn-bg:     #1e293b;
    --btn-text:   #94a3b8;
    --btn-border: #334155;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: transparent;
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  p.desc {
    text-align: center;
    font-size: 13px;
    color: var(--text-muted);
    line-height: 1.6;
  }

  /* ── Demo area ── */
  .demo-area {
    position: relative;
    height: 220px;
    border-radius: 16px;
    border: 1px solid var(--border);
    background: var(--demo-bg);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: visible;
  }

  .anchor-btn {
    anchor-name: --area-anchor;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    border-radius: 8px;
    background: #3b82f6;
    color: #fff;
    font-size: 13px;
    font-weight: 500;
    border: none;
    cursor: default;
    white-space: nowrap;
    box-shadow: 0 1px 3px rgba(0,0,0,.15);
  }

  .tooltip {
    position: absolute;
    position-anchor: --area-anchor;
    margin: 6px;
    padding: 6px 12px;
    border-radius: 6px;
    background: #1e293b;
    color: #f8fafc;
    font-size: 12px;
    white-space: nowrap;
    box-shadow: 0 4px 12px rgba(0,0,0,.2);
    pointer-events: none;
    transition: position-area 0.15s;
  }
  :root.dark .tooltip {
    background: #f1f5f9;
    color: #1e293b;
  }

  /* ── Grid selector ── */
  .grid-selector {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
  }

  .grid-btn {
    padding: 7px 4px;
    border-radius: 8px;
    font-size: 12px;
    font-family: ui-monospace, "Cascadia Code", "Source Code Pro", Menlo, Consolas, monospace;
    border: 1px solid var(--btn-border);
    background: var(--btn-bg);
    color: var(--btn-text);
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
    white-space: nowrap;
  }
  .grid-btn:hover { border-color: #3b82f6; }
  .grid-btn.active {
    background: #3b82f6;
    color: #fff;
    border-color: #3b82f6;
  }

  /* ── Code block ── */
  .code-block {
    background: var(--code-bg);
    border-radius: 12px;
    padding: 12px 16px;
    font-family: ui-monospace, "Cascadia Code", "Source Code Pro", Menlo, Consolas, monospace;
    font-size: 12px;
    color: var(--code-text);
  }
  .code-block .prop { color: var(--code-prop); }
  .code-block .val  { color: var(--code-val); }
  .code-block .cmt  { color: var(--code-cmt); }
</style>
</head>
<body>

<p class="desc">点击九宫格切换 position-area，观察浮层相对锚点的位置变化</p>

<div class="demo-area">
  <button class="anchor-btn">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
    悬停提示
  </button>
  <div class="tooltip" id="tooltip">这是一条提示信息 ✦</div>
</div>

<div class="grid-selector" id="grid">
  <button class="grid-btn" data-area="top left">top left</button>
  <button class="grid-btn active" data-area="top">top</button>
  <button class="grid-btn" data-area="top right">top right</button>
  <button class="grid-btn" data-area="left">left</button>
  <button class="grid-btn" data-area="center">center</button>
  <button class="grid-btn" data-area="right">right</button>
  <button class="grid-btn" data-area="bottom left">bottom left</button>
  <button class="grid-btn" data-area="bottom">bottom</button>
  <button class="grid-btn" data-area="bottom right">bottom right</button>
</div>

<div class="code-block">
  <span class="prop">position-area</span><span class="cmt">: </span><span class="val" id="code-val">top</span><span class="cmt">;</span>
</div>

<script>
  const params = new URLSearchParams(location.search);
  if (params.get('dark') === '1') {
    document.documentElement.classList.add('dark');
  }

  const tooltip = document.getElementById('tooltip');
  const codeVal = document.getElementById('code-val');

  // 初始值
  tooltip.style.positionArea = 'top';

  document.getElementById('grid').addEventListener('click', e => {
    const btn = e.target.closest('.grid-btn');
    if (!btn) return;

    document.querySelectorAll('.grid-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    const area = btn.dataset.area;
    tooltip.style.positionArea = area;
    codeVal.textContent = area;
  });
</script>
</body>
</html>
