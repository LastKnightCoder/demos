<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSS Anchor Position - Scroll and Visibility</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #1f2937;
      background: #f8f4f1;
    }

    main {
      width: min(960px, calc(100vw - 32px));
      margin: 32px auto;
      padding: 28px;
      background: #ffffff;
      border: 1px solid #e1d3c8;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 28px;
      letter-spacing: 0;
    }

    p {
      margin: 0 0 22px;
      color: #675a51;
      line-height: 1.7;
    }

    .scroller {
      position: relative;
      height: 420px;
      overflow: auto;
      border: 1px solid #d6c4b7;
      background: #fffaf6;
    }

    .content {
      min-height: 980px;
      padding: 28px;
      background:
        linear-gradient(90deg, rgb(154 52 18 / 8%) 1px, transparent 1px),
        linear-gradient(rgb(154 52 18 / 8%) 1px, transparent 1px);
      background-size: 36px 36px;
    }

    .spacer {
      height: 330px;
    }

    .anchor-card {
      anchor-name: --scroll-card;
      width: min(420px, 90%);
      padding: 18px;
      color: #ffffff;
      background: #9a3412;
      font-weight: 800;
    }

    .floating-note {
      position: absolute;
      position-anchor: --scroll-card;
      position-area: right;
      width: 220px;
      margin-left: 12px;
      padding: 12px;
      color: #ffffff;
      background: #292524;
      line-height: 1.55;
      position-visibility: anchors-visible;
      position-try-fallbacks: left, bottom;
    }

    .sticky-help {
      position: sticky;
      top: 0;
      z-index: 1;
      padding: 10px 12px;
      border-bottom: 1px solid #e1d3c8;
      background: #fff7ed;
      color: #7c2d12;
      font-weight: 750;
    }

    code {
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    }

    @supports not (position-visibility: anchors-visible) {
      .floating-note {
        position: static;
        margin-top: 12px;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>滚动容器与 <code>position-visibility</code></h1>
    <p>向下滚动容器。浮动说明绑定在棕色卡片右侧，并使用 <code>position-visibility: anchors-visible</code>，当锚点不可见时会隐藏。</p>

    <section class="scroller">
      <div class="sticky-help">在这个容器里滚动，观察浮层是否跟随锚点。</div>
      <div class="content">
        <div class="spacer"></div>
        <div class="anchor-card">我是滚动容器中的锚点卡片</div>
        <div class="floating-note">这个浮层的位置由锚点决定，不需要监听 scroll 事件重新计算坐标。</div>
        <div class="spacer"></div>
      </div>
    </section>
  </main>
</body>
</html>
