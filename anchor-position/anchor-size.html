<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>anchor-size() 示例</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --text-muted: #64748b;
    --border:     #e2e8f0;
    --btn-bg:     #ffffff;
    --btn-text:   #1e293b;
    --btn-border: #cbd5e1;
    --drop-bg:    #ffffff;
    --drop-text:  #1e293b;
    --drop-hover: #f1f5f9;
    --code-bg:    #f1f5f9;
    --code-text:  #475569;
    --code-prop:  #3b82f6;
    --code-val:   #f97316;
    --code-cmt:   #94a3b8;
    --demo-bg:    #f9fafb;
  }

  :root.dark {
    --text-muted: #94a3b8;
    --border:     #334155;
    --btn-bg:     #1e293b;
    --btn-text:   #e2e8f0;
    --btn-border: #475569;
    --drop-bg:    #1e293b;
    --drop-text:  #e2e8f0;
    --drop-hover: #334155;
    --code-bg:    #1e293b;
    --code-text:  #94a3b8;
    --code-prop:  #60a5fa;
    --code-val:   #fb923c;
    --code-cmt:   #475569;
    --demo-bg:    #18181b;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: transparent;
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  p.desc {
    text-align: center;
    font-size: 13px;
    color: var(--text-muted);
  }

  .demo-area {
    position: relative;
    height: 220px;
    border-radius: 16px;
    border: 1px solid var(--border);
    background: var(--demo-bg);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: visible;
  }

  .trigger {
    anchor-name: --trigger;
    display: inline-flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid var(--btn-border);
    background: var(--btn-bg);
    color: var(--btn-text);
    font-size: 13px;
    cursor: pointer;
    gap: 8px;
    width: 200px;
    transition: border-color 0.15s;
    user-select: none;
  }
  .trigger:hover { border-color: #3b82f6; }
  .trigger.open  { border-color: #3b82f6; }

  .trigger-arrow {
    width: 14px;
    height: 14px;
    flex-shrink: 0;
    transition: transform 0.2s;
  }
  .trigger.open .trigger-arrow {
    transform: rotate(180deg);
  }

  .dropdown {
    position: absolute;
    position-anchor: --trigger;
    top: anchor(--trigger bottom);
    left: anchor(--trigger left);
    width: anchor-size(--trigger width);
    margin-top: 4px;

    background: var(--drop-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,.12);
    overflow: hidden;
    z-index: 10;

    opacity: 0;
    transform: translateY(-6px);
    pointer-events: none;
    transition: opacity 0.15s, transform 0.15s;
  }
  .dropdown.open {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }

  .dropdown-item {
    padding: 8px 12px;
    font-size: 13px;
    color: var(--drop-text);
    cursor: pointer;
    transition: background 0.1s;
  }
  .dropdown-item:hover { background: var(--drop-hover); }
  .dropdown-item.selected {
    color: #3b82f6;
    font-weight: 500;
  }

  .code-block {
    background: var(--code-bg);
    border-radius: 12px;
    padding: 12px 16px;
    font-family: ui-monospace, "Cascadia Code", "Source Code Pro", Menlo, Consolas, monospace;
    font-size: 12px;
    color: var(--code-text);
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .code-block .prop { color: var(--code-prop); }
  .code-block .val  { color: var(--code-val); }
  .code-block .cmt  { color: var(--code-cmt); }
</style>
</head>
<body>

<p class="desc">下拉框通过 anchor-size() 自动与触发器等宽，无需 JavaScript 计算</p>

<div class="demo-area">
  <div class="trigger" id="trigger">
    <span id="trigger-label">请选择城市</span>
    <svg class="trigger-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <path d="M6 9l6 6 6-6"/>
    </svg>
  </div>

  <div class="dropdown" id="dropdown">
    <div class="dropdown-item" data-value="beijing">北京</div>
    <div class="dropdown-item" data-value="shanghai">上海</div>
    <div class="dropdown-item" data-value="guangzhou">广州</div>
    <div class="dropdown-item" data-value="shenzhen">深圳</div>
    <div class="dropdown-item" data-value="hangzhou">杭州</div>
  </div>
</div>

<div class="code-block">
  <div><span class="cmt">/* 下拉框与触发器等宽，无需手动计算 */</span></div>
  <div><span class="prop">top</span><span class="cmt">:   </span><span class="val">anchor(--trigger bottom)</span><span class="cmt">;</span></div>
  <div><span class="prop">left</span><span class="cmt">:  </span><span class="val">anchor(--trigger left)</span><span class="cmt">;</span></div>
  <div><span class="prop">width</span><span class="cmt">: </span><span class="val">anchor-size(--trigger width)</span><span class="cmt">;</span></div>
</div>

<script>
  const params = new URLSearchParams(location.search);
  if (params.get('dark') === '1') {
    document.documentElement.classList.add('dark');
  }

  const trigger      = document.getElementById('trigger');
  const dropdown     = document.getElementById('dropdown');
  const triggerLabel = document.getElementById('trigger-label');

  trigger.addEventListener('click', () => {
    const isOpen = dropdown.classList.toggle('open');
    trigger.classList.toggle('open', isOpen);
  });

  dropdown.querySelectorAll('.dropdown-item').forEach(item => {
    item.addEventListener('click', () => {
      dropdown.querySelectorAll('.dropdown-item').forEach(i => i.classList.remove('selected'));
      item.classList.add('selected');
      triggerLabel.textContent = item.textContent;
      dropdown.classList.remove('open');
      trigger.classList.remove('open');
    });
  });

  document.addEventListener('click', e => {
    if (!trigger.contains(e.target) && !dropdown.contains(e.target)) {
      dropdown.classList.remove('open');
      trigger.classList.remove('open');
    }
  });
</script>
</body>
</html>
