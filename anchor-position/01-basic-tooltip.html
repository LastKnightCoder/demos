<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSS Anchor Position - Basic Tooltip</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #1e293b;
      background: #f7f3ea;
    }

    main {
      width: min(760px, calc(100vw - 32px));
      padding: 40px;
      border: 1px solid #d7cdbb;
      background: #fffaf0;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 28px;
      letter-spacing: 0;
    }

    p {
      margin: 0 0 28px;
      line-height: 1.7;
      color: #475569;
    }

    .demo-row {
      min-height: 220px;
      display: grid;
      place-items: center;
      border: 1px dashed #b6a98f;
      background: #fffdf8;
    }

    .help-button {
      anchor-name: --help-button;
      border: 0;
      padding: 12px 18px;
      font: inherit;
      font-weight: 700;
      color: #ffffff;
      background: #0f766e;
      cursor: pointer;
    }

    .tooltip {
      position: absolute;
      position-anchor: --help-button;
      position-area: top;
      margin-bottom: 10px;
      width: max-content;
      max-width: 260px;
      padding: 10px 12px;
      color: #ffffff;
      background: #263238;
      font-size: 14px;
      line-height: 1.5;
      box-shadow: 0 12px 30px rgb(15 23 42 / 20%);
    }

    .tooltip::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 100%;
      translate: -50% 0;
      border: 7px solid transparent;
      border-top-color: #263238;
    }

    .notice {
      display: none;
      margin-top: 18px;
      padding: 12px;
      background: #fff4cc;
      border: 1px solid #e5bc4f;
      color: #604400;
    }

    @supports not (anchor-name: --x) {
      .tooltip {
        position: static;
        margin-top: 12px;
      }

      .tooltip::after {
        display: none;
      }

      .notice {
        display: block;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>基础 Tooltip</h1>
    <p>按钮声明 <code>anchor-name</code>，tooltip 用 <code>position-anchor</code> 绑定它，再用 <code>position-area: top</code> 放到上方。</p>

    <div class="demo-row">
      <button class="help-button">保存设置</button>
      <div class="tooltip">这个提示框不需要 JavaScript 计算按钮坐标。</div>
    </div>

    <div class="notice">当前浏览器可能不支持 CSS Anchor Positioning，所以示例会退化为普通文档流显示。</div>
  </main>
</body>
</html>
