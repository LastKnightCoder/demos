<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>position-try-order 示例</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --text-muted: #64748b;
    --border:     #e2e8f0;
    --code-bg:    #f1f5f9;
    --code-text:  #475569;
    --code-prop:  #3b82f6;
    --code-val:   #f97316;
    --code-cmt:   #94a3b8;
    --demo-bg:    #f9fafb;
    --btn-bg:     #ffffff;
    --btn-text:   #475569;
    --btn-border: #e2e8f0;
  }

  :root.dark {
    --text-muted: #94a3b8;
    --border:     #334155;
    --code-bg:    #1e293b;
    --code-text:  #94a3b8;
    --code-prop:  #60a5fa;
    --code-val:   #fb923c;
    --code-cmt:   #475569;
    --demo-bg:    #18181b;
    --btn-bg:     #1e293b;
    --btn-text:   #94a3b8;
    --btn-border: #334155;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: transparent;
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  p.desc {
    text-align: center;
    font-size: 13px;
    color: var(--text-muted);
    line-height: 1.6;
  }

  .tabs {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .tab-btn {
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 12px;
    font-family: ui-monospace, "Cascadia Code", "Source Code Pro", Menlo, Consolas, monospace;
    border: 1px solid var(--btn-border);
    background: var(--btn-bg);
    color: var(--btn-text);
    cursor: pointer;
    transition: all 0.15s;
  }
  .tab-btn:hover { border-color: #3b82f6; }
  .tab-btn.active {
    background: #3b82f6;
    color: #fff;
    border-color: #3b82f6;
  }

  .legend {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    color: var(--text-muted);
  }
  .legend-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .resize-wrap {
    overflow: hidden;
    resize: both;
    min-width: 120px;
    min-height: 80px;
    max-width: 100%;
    width: 100%;
    height: 220px;
    border-radius: 16px;
    border: 1px solid var(--border);
    display: flex;
    flex-direction: column;
  }

  .demo-area {
    position: relative;
    flex: 1;
    background: var(--demo-bg);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    min-height: 0;
  }

  .resize-hint {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 5px 0;
    background: var(--demo-bg);
    border-top: 1px solid var(--border);
    font-size: 10px;
    color: var(--text-muted);
    user-select: none;
    flex-shrink: 0;
  }

  .anchor-btn {
    anchor-name: --ord;
    display: inline-flex;
    align-items: center;
    padding: 8px 16px;
    border-radius: 8px;
    background: #3b82f6;
    color: #fff;
    font-size: 13px;
    font-weight: 500;
    border: none;
    cursor: default;
    white-space: nowrap;
    box-shadow: 0 1px 3px rgba(0,0,0,.15);
  }

  .tooltip {
    position: absolute;
    position-anchor: --ord;
    position-area: top;
    margin-bottom: 8px;
    position-try-fallbacks: --ord-below, --ord-right, --ord-left;

    padding: 6px 12px;
    border-radius: 6px;
    font-size: 12px;
    white-space: nowrap;
    pointer-events: none;
    box-shadow: 0 4px 12px rgba(0,0,0,.15);
    transition: background 0.15s;
  }

  .tooltip[data-pos="top"]    { background: #1e293b; color: #f8fafc; }
  .tooltip[data-pos="bottom"] { background: #7c3aed; color: #f8fafc; }
  .tooltip[data-pos="right"]  { background: #059669; color: #f8fafc; }
  .tooltip[data-pos="left"]   { background: #dc2626; color: #f8fafc; }

  @position-try --ord-below {
    position-area: bottom;
    margin-top: 8px;
    margin-bottom: 0;
  }
  @position-try --ord-right {
    position-area: right;
    margin-left: 8px;
    margin-bottom: 0;
  }
  @position-try --ord-left {
    position-area: left;
    margin-right: 8px;
    margin-bottom: 0;
  }

  .status-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--text-muted);
  }
  .pos-tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-family: ui-monospace, "Cascadia Code", "Source Code Pro", Menlo, Consolas, monospace;
    font-size: 11px;
    transition: background 0.15s, color 0.15s;
  }
  .pos-tag.pos-top    { background: #1e293b; color: #f8fafc; }
  .pos-tag.pos-bottom { background: #7c3aed; color: #f8fafc; }
  .pos-tag.pos-right  { background: #059669; color: #f8fafc; }
  .pos-tag.pos-left   { background: #dc2626; color: #f8fafc; }

  .code-block {
    background: var(--code-bg);
    border-radius: 12px;
    padding: 12px 16px;
    font-family: ui-monospace, "Cascadia Code", "Source Code Pro", Menlo, Consolas, monospace;
    font-size: 12px;
    color: var(--code-text);
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .code-block .prop { color: var(--code-prop); }
  .code-block .val  { color: var(--code-val); }
  .code-block .cmt  { color: var(--code-cmt); }
</style>
</head>
<body>

<p class="desc">切换 position-try-order，拖拽右下角改变容器尺寸，观察浮层选择哪个方向</p>

<div class="tabs">
  <button class="tab-btn active" data-order="normal">normal</button>
  <button class="tab-btn" data-order="most-height">most-height</button>
  <button class="tab-btn" data-order="most-width">most-width</button>
</div>

<div class="legend">
  <div class="legend-item"><div class="legend-dot" style="background:#1e293b"></div>top</div>
  <div class="legend-item"><div class="legend-dot" style="background:#7c3aed"></div>bottom</div>
  <div class="legend-item"><div class="legend-dot" style="background:#059669"></div>right</div>
  <div class="legend-item"><div class="legend-dot" style="background:#dc2626"></div>left</div>
</div>

<div class="resize-wrap" id="resize-wrap">
  <div class="demo-area">
    <div class="anchor-btn">提示按钮</div>
    <div class="tooltip" id="tooltip" data-pos="top">提示信息 ✦</div>
  </div>
  <div class="resize-hint">
    <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M21 3L3 21M21 9V3h-6M3 15v6h6"/>
    </svg>
    拖拽右下角调整宽高
  </div>
</div>

<div class="status-row">
  当前生效位置：<span class="pos-tag pos-top" id="pos-tag">top</span>
</div>

<div class="code-block">
  <div><span class="prop">position-try-order</span><span class="cmt">: </span><span class="val" id="code-order">normal</span><span class="cmt">;</span></div>
  <div><span class="prop">position-try-fallbacks</span><span class="cmt">: </span><span class="val">--ord-below, --ord-right, --ord-left</span><span class="cmt">;</span></div>
</div>

<script>
  const params = new URLSearchParams(location.search);
  if (params.get('dark') === '1') {
    document.documentElement.classList.add('dark');
  }

  const tooltip   = document.getElementById('tooltip');
  const posTag    = document.getElementById('pos-tag');
  const codeOrder = document.getElementById('code-order');

  function detectPos() {
    const anchor = document.querySelector('.anchor-btn');
    const tRect  = tooltip.getBoundingClientRect();
    const aRect  = anchor.getBoundingClientRect();
    const dy = (tRect.top + tRect.height / 2) - (aRect.top + aRect.height / 2);
    const dx = (tRect.left + tRect.width / 2) - (aRect.left + aRect.width / 2);
    const pos = Math.abs(dy) >= Math.abs(dx)
      ? (dy < 0 ? 'top' : 'bottom')
      : (dx > 0 ? 'right' : 'left');

    tooltip.dataset.pos = pos;
    posTag.textContent  = pos;
    posTag.className    = `pos-tag pos-${pos}`;
  }

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const order = btn.dataset.order;
      tooltip.style.positionTryOrder = order;
      codeOrder.textContent = order;
      requestAnimationFrame(detectPos);
    });
  });

  const ro = new ResizeObserver(() => requestAnimationFrame(detectPos));
  ro.observe(document.getElementById('resize-wrap'));

  detectPos();
</script>
</body>
</html>
