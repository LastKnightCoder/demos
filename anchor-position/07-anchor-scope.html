<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSS Anchor Position - anchor-scope</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #1f2937;
      background: #eef5f1;
    }

    main {
      width: min(980px, calc(100vw - 32px));
      margin: 32px auto;
      padding: 28px;
      background: #ffffff;
      border: 1px solid #c9ded2;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 28px;
      letter-spacing: 0;
    }

    p {
      margin: 0 0 24px;
      color: #53635b;
      line-height: 1.7;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 24px;
    }

    .card {
      anchor-scope: --shared-trigger;
      position: relative;
      min-height: 300px;
      padding: 24px;
      border: 1px solid #b9d3c4;
      background: #fafffc;
    }

    .card h2 {
      margin: 0 0 60px;
      font-size: 20px;
      letter-spacing: 0;
    }

    .trigger {
      anchor-name: --shared-trigger;
      border: 0;
      padding: 12px 16px;
      color: #ffffff;
      background: #047857;
      font: inherit;
      font-weight: 800;
    }

    .note {
      position: absolute;
      position-anchor: --shared-trigger;
      position-area: bottom;
      width: max-content;
      max-width: 230px;
      margin-top: 10px;
      padding: 11px 12px;
      color: #ffffff;
      background: #1f2937;
      line-height: 1.5;
      box-shadow: 0 16px 36px rgb(15 23 42 / 16%);
    }

    .card:nth-child(2) .trigger {
      margin-left: auto;
      display: block;
      background: #b45309;
    }

    .card:nth-child(2) .note {
      background: #3f2f1c;
    }

    code {
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    }

    @media (max-width: 760px) {
      .board {
        grid-template-columns: 1fr;
      }
    }

    @supports not (anchor-scope: --x) {
      .note {
        position: static;
        margin-top: 12px;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1><code>anchor-scope</code> 限制锚点范围</h1>
    <p>两张卡片内部都使用同一个锚点名 <code>--shared-trigger</code>。每张卡片设置 <code>anchor-scope</code> 后，说明气泡只会绑定当前卡片里的按钮。</p>

    <section class="board">
      <article class="card">
        <h2>组件实例 A</h2>
        <button class="trigger">A 的按钮</button>
        <div class="note">我绑定的是 A 卡片内部的同名锚点。</div>
      </article>

      <article class="card">
        <h2>组件实例 B</h2>
        <button class="trigger">B 的按钮</button>
        <div class="note">我绑定的是 B 卡片内部的同名锚点。</div>
      </article>
    </section>
  </main>
</body>
</html>
