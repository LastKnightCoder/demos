<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图片查看器 - File System Access API</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
    }
    h1 { color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin: 20px 0;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }
    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 25px;
      font-size: 16px;
      cursor: pointer;
      margin: 5px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
    }
    button:disabled { background: #ccc; transform: none; box-shadow: none; }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }
    .image-card {
      background: #f5f5f5;
      border-radius: 8px;
      overflow: hidden;
      transition: transform 0.2s;
    }
    .image-card:hover { transform: scale(1.02); }
    .image-card img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      display: block;
    }
    .image-info {
      padding: 10px;
      font-size: 12px;
    }
    .image-name {
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .image-meta { color: #666; margin-top: 4px; }
  </style>
</head>
<body>
  <h1>🖼️ 图片查看器</h1>

  <div class="card">
    <h2>选择图片</h2>
    <p>支持选择单个图片、多个图片，或选择包含图片的文件夹。</p>
    <button id="pickOneBtn">选择单张图片</button>
    <button id="pickMultiBtn">选择多张图片</button>
    <button id="pickFolderBtn">选择图片文件夹</button>
    <div id="gallery" class="gallery"></div>
  </div>

  <div class="card">
    <h2>图片预览</h2>
    <div id="preview" style="text-align: center;">
      <p style="color: #999;">选择图片后在此预览</p>
    </div>
  </div>

  <script>
    const gallery = document.getElementById('gallery');
    const preview = document.getElementById('preview');
    const imageTypes = ['image/jpeg', 'image/png', 'image/gif', 'image/webp', 'image/svg+xml', 'image/bmp'];

    // 检测支持
    if (!('showOpenFilePicker' in window)) {
      document.querySelectorAll('button').forEach(btn => btn.disabled = true);
      gallery.innerHTML = '<p style="color: red;">❌ 当前浏览器不支持 File System Access API</p>';
    }

    // 选择单张图片
    document.getElementById('pickOneBtn').addEventListener('click', async () => {
      try {
        const [handle] = await window.showOpenFilePicker({
          types: [{
            description: '图片文件',
            accept: { 'image/*': ['.png', '.jpg', '.jpeg', '.gif', '.webp', '.svg', '.bmp'] }
          }],
          excludeAcceptAllOption: true
        });
        const file = await handle.getFile();
        displayImages([file]);
      } catch (err) {
        if (err.name !== 'AbortError') console.error(err);
      }
    });

    // 选择多张图片
    document.getElementById('pickMultiBtn').addEventListener('click', async () => {
      try {
        const handles = await window.showOpenFilePicker({
          multiple: true,
          types: [{
            description: '图片文件',
            accept: { 'image/*': ['.png', '.jpg', '.jpeg', '.gif', '.webp', '.svg', '.bmp'] }
          }],
          excludeAcceptAllOption: true
        });
        const files = await Promise.all(handles.map(h => h.getFile()));
        displayImages(files);
      } catch (err) {
        if (err.name !== 'AbortError') console.error(err);
      }
    });

    // 选择文件夹
    document.getElementById('pickFolderBtn').addEventListener('click', async () => {
      try {
        const dirHandle = await window.showDirectoryPicker();
        const files = [];

        for await (const entry of dirHandle.values()) {
          if (entry.kind === 'file') {
            const file = await entry.getFile();
            if (imageTypes.includes(file.type) || /\.(jpg|jpeg|png|gif|webp|svg|bmp)$/i.test(file.name)) {
              files.push(file);
            }
          }
        }

        if (files.length === 0) {
          gallery.innerHTML = '<p>该文件夹中没有找到图片文件</p>';
        } else {
          displayImages(files);
        }
      } catch (err) {
        if (err.name !== 'AbortError') console.error(err);
      }
    });

    function displayImages(files) {
      gallery.innerHTML = '';

      files.forEach(file => {
        const url = URL.createObjectURL(file);

        const card = document.createElement('div');
        card.className = 'image-card';
        card.innerHTML = `
          <img src="${url}" alt="${file.name}" loading="lazy">
          <div class="image-info">
            <div class="image-name" title="${file.name}">${file.name}</div>
            <div class="image-meta">${formatSize(file.size)}</div>
          </div>
        `;

        // 点击预览大图
        card.addEventListener('click', () => {
          preview.innerHTML = `
            <img src="${url}" alt="${file.name}" style="max-width: 100%; max-height: 500px; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.2);">
            <p><strong>${file.name}</strong><br>${formatSize(file.size)} · ${file.type}</p>
          `;
        });

        gallery.appendChild(card);
      });

      // 自动预览第一张
      if (files.length > 0) {
        const firstUrl = URL.createObjectURL(files[0]);
        preview.innerHTML = `
          <img src="${firstUrl}" alt="${files[0].name}" style="max-width: 100%; max-height: 500px; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.2);">
          <p><strong>${files[0].name}</strong><br>${formatSize(files[0].size)} · ${files[0].type}</p>
        `;
      }
    }

    function formatSize(bytes) {
      if (bytes === 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }
  </script>
</body>
</html>
