<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>method="dialog" 演示</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class'
    }
  </script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    function App() {
      const simpleDialogRef = useRef(null);
      const deleteDialogRef = useRef(null);
      const saveDialogRef = useRef(null);
      const [isDark, setIsDark] = useState(false);
      const [logs, setLogs] = useState([]);

      useEffect(() => {
        if (isDark) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }, [isDark]);

      const addLog = (message) => {
        setLogs(prev => [...prev, { time: new Date().toLocaleTimeString(), message }]);
      };

      const handleSimpleClose = () => {
        const dialog = simpleDialogRef.current;
        addLog(`简单对话框关闭，返回值: "${dialog.returnValue}"`);
      };

      const handleDeleteClose = () => {
        const dialog = deleteDialogRef.current;
        addLog(`删除确认对话框关闭，返回值: "${dialog.returnValue}"`);

        if (dialog.returnValue === 'delete') {
          addLog('✓ 用户确认删除操作');
        } else if (dialog.returnValue === 'cancel') {
          addLog('✗ 用户取消删除操作');
        }
      };

      const handleSaveClose = () => {
        const dialog = saveDialogRef.current;
        const form = dialog.querySelector('form');
        const formData = new FormData(form);

        addLog(`保存对话框关闭，返回值: "${dialog.returnValue}"`);

        if (dialog.returnValue === 'save') {
          const data = Object.fromEntries(formData);
          addLog(`✓ 保存数据: ${JSON.stringify(data)}`);
        } else if (dialog.returnValue === 'discard') {
          addLog('✗ 放弃更改');
        }
      };

      return (
        <div className="container mx-auto px-4 py-8">
          <div className="flex justify-between items-center mb-8">
            <h1 className="text-3xl font-bold text-gray-900 dark:text-white">method="dialog" 演示</h1>
            <button
              onClick={() => setIsDark(!isDark)}
              className="px-4 py-2 rounded-lg bg-gray-200 dark:bg-gray-700 text-gray-900 dark:text-white"
            >
              {isDark ? '🌞 浅色' : '🌙 深色'}
            </button>
          </div>

          <div className="grid gap-6 md:grid-cols-2 lg:grid-cols-3 mb-8">
            <div className="bg-white dark:bg-gray-800 p-6 rounded-lg shadow">
              <h2 className="text-xl font-semibold mb-4 text-gray-900 dark:text-white">简单示例</h2>
              <p className="text-gray-600 dark:text-gray-300 mb-4">
                演示 method="dialog" 的基本用法，按钮的 value 会成为 returnValue。
              </p>
              <button
                onClick={() => simpleDialogRef.current?.showModal()}
                className="px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition w-full"
              >
                打开简单对话框
              </button>
            </div>

            <div className="bg-white dark:bg-gray-800 p-6 rounded-lg shadow">
              <h2 className="text-xl font-semibold mb-4 text-gray-900 dark:text-white">删除确认</h2>
              <p className="text-gray-600 dark:text-gray-300 mb-4">
                根据返回值判断用户选择了哪个按钮。
              </p>
              <button
                onClick={() => deleteDialogRef.current?.showModal()}
                className="px-6 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg transition w-full"
              >
                删除项目
              </button>
            </div>

            <div className="bg-white dark:bg-gray-800 p-6 rounded-lg shadow">
              <h2 className="text-xl font-semibold mb-4 text-gray-900 dark:text-white">保存表单</h2>
              <p className="text-gray-600 dark:text-gray-300 mb-4">
                结合表单数据和按钮值，实现完整的表单提交流程。
              </p>
              <button
                onClick={() => saveDialogRef.current?.showModal()}
                className="px-6 py-2 bg-green-600 hover:bg-green-700 text-white rounded-lg transition w-full"
              >
                编辑设置
              </button>
            </div>
          </div>

          <div className="bg-white dark:bg-gray-800 p-6 rounded-lg shadow">
            <h3 className="text-xl font-semibold mb-4 text-gray-900 dark:text-white">操作日志</h3>
            <div className="space-y-2 max-h-64 overflow-y-auto">
              {logs.length === 0 ? (
                <p className="text-gray-500 dark:text-gray-400">暂无日志</p>
              ) : (
                logs.map((log, i) => (
                  <div key={i} className="text-sm font-mono bg-gray-100 dark:bg-gray-700 p-2 rounded text-gray-900 dark:text-white">
                    <span className="text-gray-500 dark:text-gray-400">[{log.time}]</span> {log.message}
                  </div>
                ))
              )}
            </div>
            {logs.length > 0 && (
              <button
                onClick={() => setLogs([])}
                className="mt-4 px-4 py-2 bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 text-gray-900 dark:text-white rounded-lg transition"
              >
                清空日志
              </button>
            )}
          </div>

          {/* 简单对话框 */}
          <dialog
            ref={simpleDialogRef}
            onClose={handleSimpleClose}
            className="backdrop:bg-black/50 bg-white dark:bg-gray-800 rounded-lg shadow-xl p-0 border-0"
          >
            <form method="dialog" className="p-6 min-w-[400px]">
              <h3 className="text-2xl font-bold mb-4 text-gray-900 dark:text-white">简单对话框</h3>
              <p className="text-gray-600 dark:text-gray-300 mb-6">
                这个表单使用 method="dialog"。点击任何按钮都会关闭对话框，按钮的 value 属性会成为 dialog.returnValue。
              </p>
              <div className="flex gap-3 justify-end">
                <button
                  type="submit"
                  value="cancel"
                  className="px-4 py-2 bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 text-gray-900 dark:text-white rounded-lg transition"
                >
                  取消
                </button>
                <button
                  type="submit"
                  value="ok"
                  className="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition"
                >
                  确定
                </button>
              </div>
            </form>
          </dialog>

          {/* 删除确认对话框 */}
          <dialog
            ref={deleteDialogRef}
            onClose={handleDeleteClose}
            className="backdrop:bg-black/50 bg-white dark:bg-gray-800 rounded-lg shadow-xl p-0 border-0"
          >
            <form method="dialog" className="p-6 min-w-[400px]">
              <div className="flex items-center gap-3 mb-4">
                <div className="w-12 h-12 bg-red-100 dark:bg-red-900 rounded-full flex items-center justify-center">
                  <span className="text-2xl">⚠️</span>
                </div>
                <h3 className="text-2xl font-bold text-gray-900 dark:text-white">确认删除</h3>
              </div>
              <p className="text-gray-600 dark:text-gray-300 mb-6">
                此操作无法撤销。确定要删除这个项目吗？
              </p>
              <div className="flex gap-3 justify-end">
                <button
                  type="submit"
                  value="cancel"
                  className="px-4 py-2 bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 text-gray-900 dark:text-white rounded-lg transition"
                >
                  取消
                </button>
                <button
                  type="submit"
                  value="delete"
                  className="px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg transition"
                >
                  删除
                </button>
              </div>
            </form>
          </dialog>

          {/* 保存表单对话框 */}
          <dialog
            ref={saveDialogRef}
            onClose={handleSaveClose}
            className="backdrop:bg-black/50 bg-white dark:bg-gray-800 rounded-lg shadow-xl p-0 border-0"
          >
            <form method="dialog" className="p-6 min-w-[500px]">
              <h3 className="text-2xl font-bold mb-6 text-gray-900 dark:text-white">编辑设置</h3>
              <div className="space-y-4 mb-6">
                <div>
                  <label className="block text-sm font-medium mb-2 text-gray-900 dark:text-white">
                    用户名
                  </label>
                  <input
                    type="text"
                    name="username"
                    defaultValue="张三"
                    className="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-2 focus:ring-green-500"
                  />
                </div>
                <div>
                  <label className="block text-sm font-medium mb-2 text-gray-900 dark:text-white">
                    邮箱
                  </label>
                  <input
                    type="email"
                    name="email"
                    defaultValue="zhangsan@example.com"
                    className="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-2 focus:ring-green-500"
                  />
                </div>
                <div>
                  <label className="block text-sm font-medium mb-2 text-gray-900 dark:text-white">
                    通知
                  </label>
                  <select
                    name="notifications"
                    defaultValue="all"
                    className="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-2 focus:ring-green-500"
                  >
                    <option value="all">全部通知</option>
                    <option value="important">仅重要通知</option>
                    <option value="none">关闭通知</option>
                  </select>
                </div>
              </div>
              <div className="flex gap-3 justify-end">
                <button
                  type="submit"
                  value="cancel"
                  className="px-4 py-2 bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 text-gray-900 dark:text-white rounded-lg transition"
                >
                  取消
                </button>
                <button
                  type="submit"
                  value="discard"
                  className="px-4 py-2 bg-orange-600 hover:bg-orange-700 text-white rounded-lg transition"
                >
                  放弃更改
                </button>
                <button
                  type="submit"
                  value="save"
                  className="px-4 py-2 bg-green-600 hover:bg-green-700 text-white rounded-lg transition"
                >
                  保存
                </button>
              </div>
            </form>
          </dialog>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
