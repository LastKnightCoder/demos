<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>句子填空（兼容版）- React + Tailwind</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Babel Standalone -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // 自动调整输入框宽度的 Hook
        function useAutoWidth(value, minWidth = 40, maxWidth = 300) {
            const [width, setWidth] = useState(minWidth);
            const measureRef = useRef(null);

            useEffect(() => {
                if (!measureRef.current) {
                    measureRef.current = document.createElement('span');
                    measureRef.current.style.cssText = `
                        position: absolute;
                        visibility: hidden;
                        white-space: nowrap;
                        font-size: inherit;
                        font-family: inherit;
                        font-weight: 600;
                        padding: 2px 8px;
                    `;
                    document.body.appendChild(measureRef.current);
                }

                measureRef.current.textContent = value || '';
                const textWidth = measureRef.current.offsetWidth;
                const newWidth = Math.max(minWidth, Math.min(textWidth + 20, maxWidth));
                setWidth(newWidth);

                return () => {
                    if (measureRef.current && measureRef.current.parentNode) {
                        document.body.removeChild(measureRef.current);
                    }
                };
            }, [value, minWidth, maxWidth]);

            return width;
        }

        // 自适应宽度输入框组件
        function AutoWidthInput({ placeholder, value, onChange, minWidth, maxWidth, className = '' }) {
            const width = useAutoWidth(value || placeholder, minWidth, maxWidth);

            return (
                <input
                    type="text"
                    value={value}
                    onChange={(e) => onChange(e.target.value)}
                    placeholder={placeholder}
                    className={`border-none border-b-2 border-blue-400 bg-transparent outline-none text-inherit font-semibold text-blue-600 px-2 mx-1 transition-all duration-200 focus:border-blue-600 focus:bg-blue-50/50 ${className}`}
                    style={{ width: `${width}px` }}
                />
            );
        }

        // 支持信息组件
        function SupportInfo() {
            const [isSupported, setIsSupported] = useState(null);

            useEffect(() => {
                const testElement = document.createElement('div');
                testElement.style.fieldSizing = 'content';
                setIsSupported(testElement.style.fieldSizing === 'content');
            }, []);

            if (isSupported === null) {
                return (
                    <div className="bg-yellow-100 border-2 border-yellow-400 rounded-xl p-4 mb-6 flex items-center gap-3">
                        <span className="text-2xl">🔍</span>
                        <span className="text-yellow-800">正在检测浏览器支持...</span>
                    </div>
                );
            }

            return (
                <div className={`${isSupported ? 'bg-green-100 border-green-500' : 'bg-yellow-100 border-yellow-400'} border-2 rounded-xl p-4 mb-6 flex items-center gap-3`}>
                    <span className="text-2xl">{isSupported ? '✅' : '⚠️'}</span>
                    <span className={isSupported ? 'text-green-800' : 'text-yellow-800'}>
                        {isSupported
                            ? '您的浏览器支持 field-sizing！但为了演示兼容性方案，本页面使用 React 实现。'
                            : '您的浏览器不支持 field-sizing 属性，本页面使用 React 降级方案，效果相同。'
                        }
                    </span>
                </div>
            );
        }

        // 主应用组件
        function App() {
            const [name1, setName1] = useState('');
            const [age1, setAge1] = useState('');
            const [city, setCity] = useState('');
            const [job, setJob] = useState('');
            const [country, setCountry] = useState('');
            const [capital, setCapital] = useState('');

            const [nameCn, setNameCn] = useState('');
            const [ageCn, setAgeCn] = useState('');
            const [cityCn, setCityCn] = useState('');
            const [jobCn, setJobCn] = useState('');

            const fillExample1 = () => {
                setName1('Christopher');
                setAge1('25');
                setCity('New York');
                setJob('Software Engineer');
                setCountry('France');
                setCapital('Paris');
            };

            const fillExample2 = () => {
                setName1('Bob');
                setAge1('8');
                setCity('LA');
                setJob('Designer');
                setCountry('Japan');
                setCapital('Tokyo');
            };

            const clearAll = () => {
                setName1('');
                setAge1('');
                setCity('');
                setJob('');
                setCountry('');
                setCapital('');
                setNameCn('');
                setAgeCn('');
                setCityCn('');
                setJobCn('');
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-cyan-300 to-blue-400 py-10 px-5">
                    <div className="max-w-4xl mx-auto">
                        {/* Header */}
                        <header className="text-center text-white mb-10">
                            <h1 className="text-5xl font-bold mb-3 drop-shadow-lg">
                                📝 句子填空（兼容版）
                            </h1>
                            <p className="text-xl opacity-95">
                                使用 React + Tailwind 实现自适应宽度的填空输入框
                            </p>
                        </header>

                        {/* Support Info */}
                        <SupportInfo />

                        {/* Basic Demo */}
                        <div className="bg-white rounded-3xl p-10 mb-8 shadow-2xl">
                            <h2 className="text-3xl font-bold text-gray-800 mb-6 border-l-4 border-blue-400 pl-5">
                                🎯 自适应宽度填空示例
                            </h2>

                            <div className="bg-blue-50 border-l-4 border-blue-400 p-4 rounded-lg mb-5">
                                <p className="text-gray-700">
                                    💡 输入框宽度会自动根据内容长度调整。这个版本使用 React 实现，兼容所有现代浏览器。
                                </p>
                            </div>

                            <div className="flex gap-3 mb-6 flex-wrap">
                                <button
                                    onClick={fillExample1}
                                    className="bg-blue-400 text-white px-5 py-2 rounded-lg font-medium hover:bg-blue-500 transition-colors"
                                >
                                    填充示例：Christopher
                                </button>
                                <button
                                    onClick={fillExample2}
                                    className="bg-blue-400 text-white px-5 py-2 rounded-lg font-medium hover:bg-blue-500 transition-colors"
                                >
                                    填充示例：Bob
                                </button>
                                <button
                                    onClick={clearAll}
                                    className="bg-gray-400 text-white px-5 py-2 rounded-lg font-medium hover:bg-gray-500 transition-colors"
                                >
                                    清空所有
                                </button>
                            </div>

                            {/* English Sentences */}
                            <div className="text-2xl leading-relaxed mb-6 p-5 bg-gray-50 rounded-xl">
                                <div className="mb-4">
                                    My name is
                                    <AutoWidthInput
                                        value={name1}
                                        onChange={setName1}
                                        placeholder="your name"
                                        minWidth={60}
                                        maxWidth={300}
                                    />
                                    and I am
                                    <AutoWidthInput
                                        value={age1}
                                        onChange={setAge1}
                                        placeholder="25"
                                        minWidth={30}
                                        maxWidth={80}
                                        className="text-center"
                                    />
                                    years old.
                                </div>
                            </div>

                            {name1 && (
                                <div className="text-sm text-gray-600 font-mono mb-6">
                                    📏 name 字段：{name1.length} 个字符
                                </div>
                            )}

                            <div className="text-xl leading-relaxed mb-4 p-5 bg-gray-50 rounded-xl">
                                I live in
                                <AutoWidthInput
                                    value={city}
                                    onChange={setCity}
                                    placeholder="city"
                                    minWidth={60}
                                    maxWidth={250}
                                />
                                and work as a
                                <AutoWidthInput
                                    value={job}
                                    onChange={setJob}
                                    placeholder="profession"
                                    minWidth={100}
                                    maxWidth={400}
                                />.
                            </div>

                            <div className="text-xl leading-relaxed p-5 bg-gray-50 rounded-xl">
                                The capital of
                                <AutoWidthInput
                                    value={country}
                                    onChange={setCountry}
                                    placeholder="country"
                                    minWidth={80}
                                    maxWidth={250}
                                />
                                is
                                <AutoWidthInput
                                    value={capital}
                                    onChange={setCapital}
                                    placeholder="capital city"
                                    minWidth={80}
                                    maxWidth={250}
                                />.
                            </div>
                        </div>

                        {/* Chinese Demo */}
                        <div className="bg-white rounded-3xl p-10 mb-8 shadow-2xl">
                            <h2 className="text-3xl font-bold text-gray-800 mb-6 border-l-4 border-blue-400 pl-5">
                                🇨🇳 中文句子填空
                            </h2>

                            <div className="text-2xl leading-relaxed mb-6 p-5 bg-gray-50 rounded-xl">
                                我叫
                                <AutoWidthInput
                                    value={nameCn}
                                    onChange={setNameCn}
                                    placeholder="姓名"
                                    minWidth={60}
                                    maxWidth={200}
                                />
                                ，今年
                                <AutoWidthInput
                                    value={ageCn}
                                    onChange={setAgeCn}
                                    placeholder="年龄"
                                    minWidth={40}
                                    maxWidth={80}
                                    className="text-center"
                                />
                                岁。
                            </div>

                            <div className="text-xl leading-relaxed p-5 bg-gray-50 rounded-xl">
                                我来自
                                <AutoWidthInput
                                    value={cityCn}
                                    onChange={setCityCn}
                                    placeholder="城市"
                                    minWidth={60}
                                    maxWidth={200}
                                />
                                ，从事
                                <AutoWidthInput
                                    value={jobCn}
                                    onChange={setJobCn}
                                    placeholder="职业"
                                    minWidth={80}
                                    maxWidth={250}
                                />
                                工作。
                            </div>
                        </div>

                        {/* Implementation */}
                        <div className="bg-white rounded-3xl p-10 mb-8 shadow-2xl">
                            <h2 className="text-3xl font-bold text-gray-800 mb-6 border-l-4 border-blue-400 pl-5">
                                💻 实现原理
                            </h2>

                            <div className="grid md:grid-cols-2 gap-5 mb-6">
                                <div className="bg-yellow-50 border-2 border-yellow-400 p-5 rounded-xl">
                                    <h4 className="text-yellow-800 font-bold mb-3 text-lg">🔮 理想方案（CSS）</h4>
                                    <pre className="bg-gray-900 text-gray-100 p-4 rounded-lg text-sm overflow-x-auto">
{`input {
  field-sizing: content;
  min-width: 5ch;
  max-width: 30ch;
}`}
                                    </pre>
                                    <p className="text-yellow-700 mt-3 text-sm">
                                        ⚠️ 浏览器支持有限
                                    </p>
                                </div>

                                <div className="bg-green-50 border-2 border-green-500 p-5 rounded-xl">
                                    <h4 className="text-green-800 font-bold mb-3 text-lg">✅ 实用方案（React）</h4>
                                    <pre className="bg-gray-900 text-gray-100 p-4 rounded-lg text-sm overflow-x-auto">
{`// 动态计算宽度
const width =
  useAutoWidth(value);`}
                                    </pre>
                                    <p className="text-green-700 mt-3 text-sm">
                                        ✅ 兼容所有浏览器
                                    </p>
                                </div>
                            </div>

                            <h3 className="text-2xl font-bold text-gray-800 mb-4">React Hook 实现：</h3>
                            <pre className="bg-gray-900 text-gray-100 p-6 rounded-xl text-sm overflow-x-auto">
{`function useAutoWidth(value, minWidth = 40, maxWidth = 300) {
  const [width, setWidth] = useState(minWidth);
  const measureRef = useRef(null);

  useEffect(() => {
    // 创建隐藏测量元素
    if (!measureRef.current) {
      measureRef.current = document.createElement('span');
      measureRef.current.style.cssText = \`
        position: absolute;
        visibility: hidden;
        white-space: nowrap;
      \`;
      document.body.appendChild(measureRef.current);
    }

    // 测量文本宽度
    measureRef.current.textContent = value || '';
    const textWidth = measureRef.current.offsetWidth;

    // 设置宽度（在min和max之间）
    const newWidth = Math.max(
      minWidth,
      Math.min(textWidth + 20, maxWidth)
    );
    setWidth(newWidth);
  }, [value, minWidth, maxWidth]);

  return width;
}`}
                            </pre>
                        </div>

                        {/* Back to Home */}
                        <div className="text-center">
                            <a
                                href="index.html"
                                className="inline-block bg-white text-blue-400 px-10 py-4 rounded-full font-semibold shadow-xl hover:-translate-y-1 transition-transform"
                            >
                                ← 返回首页
                            </a>
                        </div>
                    </div>
                </div>
            );
        }

        // Render
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
