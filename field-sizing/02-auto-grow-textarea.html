<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自动增长的文本域 - React + Tailwind</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Babel Standalone -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function App() {
            const [comment, setComment] = useState('');

            const fillShortText = () => {
                setComment('这是一段简短的评论文本。');
            };

            const fillLongText = () => {
                setComment(`这是一段较长的评论文本，用于演示 field-sizing 的自动增长功能。

当你输入更多内容时，文本框会自动增加高度，而不会出现滚动条。

这个特性特别适合：
• 评论输入框
• 邮件编辑器
• 笔记应用
• 表单文本域
• 即时通讯应用

使用 field-sizing: content 可以显著提升用户体验，让文本输入更加流畅自然。

不需要编写任何 JavaScript 代码，纯 CSS 就能实现这个效果！

继续输入更多内容试试看...`);
            };

            const clearText = () => {
                setComment('');
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-pink-400 to-red-400 py-10 px-5">
                    <div className="max-w-3xl mx-auto">
                        {/* Header */}
                        <header className="text-center text-white mb-10">
                            <h1 className="text-5xl font-bold mb-3 drop-shadow-lg">
                                📝 自动增长的文本域
                            </h1>
                            <p className="text-xl opacity-95">
                                使用 field-sizing 实现无需 JavaScript 的自适应文本框
                            </p>
                        </header>

                        {/* Main Demo */}
                        <div className="bg-white rounded-3xl p-8 mb-8 shadow-2xl">
                            <h2 className="text-3xl font-bold text-gray-800 mb-5 flex items-center gap-3">
                                <span className="text-4xl">💬</span>
                                评论输入框
                            </h2>

                            <div className="bg-blue-50 border-l-4 border-blue-400 p-4 rounded-lg mb-5">
                                <p className="text-gray-700 mb-3">
                                    <strong>💡 试试这些操作：</strong>
                                </p>
                                <div className="flex gap-2 flex-wrap">
                                    <button
                                        onClick={fillShortText}
                                        className="bg-pink-500 text-white px-4 py-2 rounded-lg hover:bg-pink-600 transition-colors"
                                    >
                                        填充短文本
                                    </button>
                                    <button
                                        onClick={fillLongText}
                                        className="bg-pink-500 text-white px-4 py-2 rounded-lg hover:bg-pink-600 transition-colors"
                                    >
                                        填充长文本
                                    </button>
                                    <button
                                        onClick={clearText}
                                        className="bg-gray-400 text-white px-4 py-2 rounded-lg hover:bg-gray-500 transition-colors"
                                    >
                                        清空
                                    </button>
                                </div>
                            </div>

                            <div className="mb-5">
                                <label className="block mb-2 text-gray-700 font-semibold text-lg">
                                    发表评论：
                                </label>
                                <textarea
                                    value={comment}
                                    onChange={(e) => setComment(e.target.value)}
                                    placeholder="写下你的想法...&#10;&#10;这个文本框会随着内容自动增长！&#10;不会出现滚动条（在最大高度之前）&#10;无需 JavaScript 干预"
                                    className="w-full p-4 border-2 border-gray-300 rounded-xl text-base focus:outline-none focus:border-pink-500 focus:ring-4 focus:ring-pink-200 transition-all resize-none"
                                    style={{ fieldSizing: 'content', minHeight: '3lh', maxHeight: '20lh' }}
                                />
                                <div className="text-right text-sm text-gray-600 mt-2 font-mono">
                                    {comment.length} 个字符
                                </div>
                            </div>

                            <div className="grid grid-cols-3 gap-4">
                                <div className="bg-gradient-to-br from-indigo-500 to-purple-600 text-white p-5 rounded-xl text-center">
                                    <h3 className="font-bold mb-2">🚀 纯 CSS</h3>
                                    <p className="text-sm opacity-90">无需 JavaScript</p>
                                </div>
                                <div className="bg-gradient-to-br from-indigo-500 to-purple-600 text-white p-5 rounded-xl text-center">
                                    <h3 className="font-bold mb-2">📏 自适应</h3>
                                    <p className="text-sm opacity-90">内容决定高度</p>
                                </div>
                                <div className="bg-gradient-to-br from-indigo-500 to-purple-600 text-white p-5 rounded-xl text-center">
                                    <h3 className="font-bold mb-2">⚡ 高性能</h3>
                                    <p className="text-sm opacity-90">浏览器原生支持</p>
                                </div>
                            </div>
                        </div>

                        {/* CSS vs JS Comparison */}
                        <div className="bg-white rounded-3xl p-8 mb-8 shadow-2xl">
                            <h2 className="text-3xl font-bold text-gray-800 mb-5 flex items-center gap-3">
                                <span className="text-4xl">⚔️</span>
                                实现方式对比
                            </h2>

                            <div className="grid md:grid-cols-2 gap-5">
                                <div className="bg-yellow-50 border-2 border-yellow-400 p-5 rounded-xl">
                                    <h3 className="text-yellow-800 font-bold mb-3 text-lg text-center">
                                        传统 JavaScript 方法
                                        <span className="bg-yellow-400 text-black px-2 py-1 rounded-full text-xs ml-2">JS</span>
                                    </h3>
                                    <pre className="bg-gray-900 text-gray-100 p-4 rounded-lg overflow-x-auto text-xs font-mono">
{`textarea.addEventListener('input', () => {
  textarea.style.height = 'auto';
  textarea.style.height =
    textarea.scrollHeight + 'px';
});`}
                                    </pre>
                                    <p className="mt-4 text-yellow-700 text-sm space-y-1">
                                        <div>❌ 需要监听事件</div>
                                        <div>❌ 手动计算高度</div>
                                        <div>❌ 可能影响性能</div>
                                    </p>
                                </div>

                                <div className="bg-green-50 border-2 border-green-500 p-5 rounded-xl">
                                    <h3 className="text-green-800 font-bold mb-3 text-lg text-center">
                                        field-sizing 方法
                                        <span className="bg-green-500 text-white px-2 py-1 rounded-full text-xs ml-2">CSS</span>
                                    </h3>
                                    <pre className="bg-gray-900 text-gray-100 p-4 rounded-lg overflow-x-auto text-xs font-mono">
{`textarea {
  field-sizing: content;
  min-height: 3lh;
  max-height: 20lh;
}`}
                                    </pre>
                                    <p className="mt-4 text-green-700 text-sm space-y-1">
                                        <div>✅ 纯 CSS 实现</div>
                                        <div>✅ 自动计算高度</div>
                                        <div>✅ 浏览器原生优化</div>
                                    </p>
                                </div>
                            </div>
                        </div>

                        {/* Multiple Scenarios */}
                        <div className="bg-white rounded-3xl p-8 mb-8 shadow-2xl">
                            <h2 className="text-3xl font-bold text-gray-800 mb-5 flex items-center gap-3">
                                <span className="text-4xl">🎨</span>
                                多种场景应用
                            </h2>

                            <div className="space-y-5">
                                <div>
                                    <label className="block mb-2 text-gray-700 font-semibold">
                                        📧 邮件正文
                                    </label>
                                    <textarea
                                        placeholder="撰写邮件内容..."
                                        className="w-full p-4 border-2 border-gray-300 rounded-xl focus:outline-none focus:border-pink-500 focus:ring-4 focus:ring-pink-200 transition-all resize-none"
                                        style={{ fieldSizing: 'content', minHeight: '5lh', maxHeight: '25lh' }}
                                    />
                                </div>

                                <div>
                                    <label className="block mb-2 text-gray-700 font-semibold">
                                        📋 待办事项
                                    </label>
                                    <textarea
                                        placeholder="• 任务 1&#10;• 任务 2&#10;• 任务 3"
                                        className="w-full p-4 border-2 border-gray-300 rounded-xl focus:outline-none focus:border-pink-500 focus:ring-4 focus:ring-pink-200 transition-all resize-none"
                                        style={{ fieldSizing: 'content', minHeight: '2lh', maxHeight: '10lh' }}
                                    />
                                </div>

                                <div>
                                    <label className="block mb-2 text-gray-700 font-semibold">
                                        🔍 搜索备注
                                    </label>
                                    <textarea
                                        placeholder="添加搜索备注..."
                                        className="w-full p-4 border-2 border-gray-300 rounded-xl focus:outline-none focus:border-pink-500 focus:ring-4 focus:ring-pink-200 transition-all resize-none"
                                        style={{ fieldSizing: 'content', minHeight: '2lh', maxHeight: '8lh' }}
                                    />
                                </div>
                            </div>
                        </div>

                        {/* Full Code */}
                        <div className="bg-white rounded-3xl p-8 mb-8 shadow-2xl">
                            <h2 className="text-3xl font-bold text-gray-800 mb-5 flex items-center gap-3">
                                <span className="text-4xl">💻</span>
                                完整 CSS 代码
                            </h2>
                            <pre className="bg-gray-900 text-gray-100 p-6 rounded-xl overflow-x-auto text-sm font-mono">
{`/* 自动增长的文本域 */
textarea {
  field-sizing: content;
  min-height: 3lh;      /* 最小 3 行高度 */
  max-height: 20lh;     /* 最大 20 行高度 */
  resize: none;          /* 禁用手动调整大小 */
  width: 100%;
  padding: 15px;
  font-family: inherit;
  font-size: 1rem;
  border: 2px solid #e9ecef;
  border-radius: 12px;
  transition: border-color 0.3s;
}

textarea:focus {
  outline: none;
  border-color: #f5576c;
  box-shadow: 0 0 0 3px rgba(245, 87, 108, 0.1);
}

/* 浏览器兼容性检测 */
@supports not (field-sizing: content) {
  textarea {
    min-height: 100px;   /* 降级方案 */
    resize: vertical;     /* 允许手动调整 */
  }
}`}
                            </pre>
                        </div>

                        {/* Back to Home */}
                        <div className="text-center">
                            <a
                                href="index.html"
                                className="inline-block bg-white text-pink-500 px-10 py-4 rounded-full font-semibold shadow-xl hover:-translate-y-1 transition-transform"
                            >
                                ← 返回首页
                            </a>
                        </div>
                    </div>
                </div>
            );
        }

        // Render
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
