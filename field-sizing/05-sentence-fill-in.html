        // 主题切换组件
        function ThemeToggle() {
            const [isDark, setIsDark] = useState(false);

            useEffect(() => {
                const savedTheme = localStorage.getItem('theme');
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                const shouldBeDark = savedTheme === 'dark' || (!savedTheme && prefersDark);

                setIsDark(shouldBeDark);
                if (shouldBeDark) {
                    document.documentElement.classList.add('dark');
                }
            }, []);

            const toggleTheme = () => {
                setIsDark(!isDark);
                if (!isDark) {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('theme', 'dark');
                } else {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('theme', 'light');
                }
            };

            return (
                <button
                    onClick={toggleTheme}
                    className="fixed top-6 right-6 bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-200 p-3 rounded-full shadow-xl hover:shadow-2xl transition-all hover:scale-110 z-50"
                    aria-label="Toggle theme"
                >
                    {isDark ? '🌞' : '🌙'}
                </button>
            );
        }

        // 宽度指示器组件
        function WidthIndicator({ id, value }) {
            if (!value) return null;
            return (
                <div className="text-sm text-gray-600 dark:text-gray-400 font-mono mt-2">
                    📏 {id}: 字符数 {value.length}
                </div>
            );
        }

                            <h2 className="text-3xl font-bold text-gray-800 dark:text-gray-100 mb-6 border-l-4 border-blue-400 dark:border-blue-500 pl-5">
                                ⚡ 为什么使用 field-sizing？
                            </h2>

                            <div className="grid md:grid-cols-2 gap-5">
                                <div className="bg-yellow-50 dark:bg-yellow-900/20 border-2 border-yellow-400 dark:border-yellow-600 p-5 rounded-xl">
                                    <h3 className="text-yellow-800 dark:text-yellow-400 font-bold text-lg mb-4">❌ 传统方法的问题</h3>
                                    <ul className="text-yellow-700 dark:text-yellow-300 space-y-2 ml-5 list-disc">
                                        <li>固定宽度：<code className="bg-yellow-100 dark:bg-yellow-900/50 px-1 rounded">width: 100px</code></li>
                                        <li>短文本浪费空间</li>
                                        <li>长文本被截断</li>
                                        <li>需要 JavaScript 动态调整</li>
                                        <li>代码复杂，性能开销</li>
                                    </ul>
                                </div>

                                <div className="bg-green-50 dark:bg-green-900/20 border-2 border-green-500 dark:border-green-600 p-5 rounded-xl">
                                    <h3 className="text-green-800 dark:text-green-400 font-bold text-lg mb-4">✅ field-sizing 的优势</h3>
                                    <ul className="text-green-700 dark:text-green-300 space-y-2 ml-5 list-disc">
                                        <li>自动调整宽度</li>
                                        <li>完美适应内容</li>
                                        <li>纯 CSS 实现</li>
                                        <li>无需 JavaScript</li>
                                        <li>性能更好，代码更简洁</li>
                                    </ul>
                                </div>
                            </div>
                        </div>

                        {/* 返回首页 */}
                        <div className="text-center">
                            <a
                                href="index.html"
                                className="inline-block bg-white dark:bg-gray-700 text-blue-400 dark:text-blue-300 px-10 py-4 rounded-full font-semibold shadow-xl hover:-translate-y-1 transition-transform"
                            >
                                ← 返回首页
                            </a>
                        </div>
                    </div>
                </div>
            );
        }

        // Render
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
